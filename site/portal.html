<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بوابة الإدارة العامة للدفاع المدني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#0E3D2C; --surface:#FFFFFF; --surface-2:#F7F9F8; --line:#5E8F79;--edge:#1F5A43;
  --text:#0B1612; --muted:#2C3A33; --faint:#4A5852;
  --accent:#1F7A56; --accent-hover:#17694A; --on-accent:#FFFFFF; --accent-soft:#E4F1EA;
  --danger:#B42318; --danger-bg:#FDECEA; --shadow:0 30px 60px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A2A1F; --surface:#151D1A; --surface-2:#19231F; --line:#33463E;--edge:#3E7A62;
    --text:#E6ECE9; --muted:#A3B0AA; --faint:#7F8C86;
    --accent:#45A980; --accent-hover:#5BBB93; --on-accent:#05130D; --accent-soft:#16352A;
    --danger:#F97066; --danger-bg:#3A1714;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A2A1F; --surface:#151D1A; --surface-2:#19231F; --line:#33463E;--edge:#3E7A62;
  --text:#E6ECE9; --muted:#A3B0AA; --faint:#7F8C86;
  --accent:#45A980; --accent-hover:#5BBB93; --on-accent:#05130D; --accent-soft:#16352A;
  --danger:#F97066; --danger-bg:#3A1714;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{font-family:'Tajawal',"Segoe UI",Tahoma,system-ui,sans-serif;color:var(--text);line-height:1.55;font-size:15px}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:72px 16px 48px;position:relative;overflow:hidden}
.page::before{content:"";position:absolute;inset:0;background:radial-gradient(560px 560px at 85% 12%,rgba(255,255,255,.06),transparent 70%),radial-gradient(480px 480px at 8% 92%,rgba(255,255,255,.05),transparent 70%);pointer-events:none}
.band{position:absolute;top:0;left:0;right:0;background:#B42318;color:#fff;text-align:center;font-size:13px;font-weight:800;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));z-index:1}
.card{position:relative;width:100%;max-width:440px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:40px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.card.wide{max-width:980px}
.logo{width:92px;height:92px;border-radius:50%;background:#fff;border:1px solid #E6ECE9;display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden}
.logo img{width:80px;height:80px;object-fit:contain}
h1{margin:0;font-size:24px;font-weight:800;text-wrap:balance}
.org{font-size:17px;font-weight:700;color:var(--accent);margin-top:2px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.fld{width:100%;margin-top:22px;text-align:start}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.fld input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-size:15px;outline:none}
.fld input:focus{border-color:var(--accent)}
.err{display:none;margin-top:8px;color:var(--danger);font-size:13.5px;font-weight:600}
.btn{width:100%;margin-top:14px;padding:14px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700;cursor:pointer;min-height:48px}
.btn:hover{background:var(--accent-hover)}
.btn[disabled]{opacity:.6;cursor:progress}
.foot{margin-top:22px;font-size:12px;color:var(--faint)}
.units{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));grid-auto-rows:1fr;gap:12px;margin-top:22px}
.unit{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;padding:16px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);min-height:118px;transition:border-color .15s,box-shadow .15s,transform .15s}
.unit:hover{border-color:var(--accent);box-shadow:0 10px 26px rgba(14,61,44,.14);transform:translateY(-2px)}
.unit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.unit .ic{width:40px;height:40px;flex-shrink:0;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.unit b{font-size:17px;font-weight:800}
.unit small{font-size:13px;color:var(--muted)}
.unit .go{margin-top:auto;font-size:13px;font-weight:700;color:var(--accent)}
.mgr{box-sizing:border-box;width:100%;display:flex;align-items:center;gap:14px;margin-top:22px;padding:16px 18px;border-radius:14px;background:var(--accent);color:var(--on-accent);text-decoration:none;text-align:start;transition:background .15s,transform .15s,box-shadow .15s}
.mgr:hover{background:var(--accent-hover);transform:translateY(-2px);box-shadow:0 10px 26px rgba(14,61,44,.2)}
.mgr:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mgr .ic{width:46px;height:46px;flex-shrink:0;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.mgr .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mgr b{font-size:18px;font-weight:800}
.mgr small{font-size:13px;opacity:.85}
.mgr .go{font-size:13px;font-weight:700;white-space:nowrap}
.big{font-size:28px;font-weight:900;line-height:1.35}
.sect>.gbar{padding:18px 20px;border-width:2px;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sect>.gbar b{font-size:20px;font-weight:900}
.sect>.gbar small{color:var(--on-accent);opacity:.85}
.sect>.gbar .ic{background:rgba(255,255,255,.16)}
.sect>.gbar .chev{color:var(--on-accent)}
.sect>.gbody{display:flex;flex-direction:column;gap:12px}
.sect>.gbody[hidden]{display:none}
.sect .mgr{margin-top:0}
.admins{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.adm{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:start;padding:26px 24px;border-radius:18px;background:var(--accent);color:var(--on-accent);min-height:190px;transition:transform .15s,box-shadow .15s}
.adm:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(14,61,44,.28);background:var(--accent-hover)}
.adm:focus-visible{outline:3px solid var(--edge);outline-offset:3px}
.adm .ic{width:56px;height:56px;border-radius:15px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.adm b{font-size:22px;font-weight:900}.adm small{font-size:13.5px;opacity:.9;line-height:1.7}
.adm .go{margin-top:auto;display:flex;align-items:center;gap:4px;font-weight:800;font-size:14px}
.vhead{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:20px;padding-bottom:14px;border-bottom:1.5px solid var(--line);text-align:start}
.vhead .back{font-weight:800;font-size:14px;color:var(--accent);text-decoration:none;white-space:nowrap}
.vhead .back:hover{text-decoration:underline}
.vt{flex:1;min-width:180px}.vt h2{margin:0;font-size:22px;font-weight:900}.vt small{color:var(--muted);font-size:13px}
.srch{flex:0 1 260px}.srch input{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);outline:none}
.srch input:focus{border-color:var(--accent)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#vbody{width:100%;text-align:start}
.blk{margin-top:22px}.blk h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:16px;font-weight:900;color:var(--text)}
.blk .cnt{font-size:12px;font-weight:800;background:var(--accent-soft);color:var(--accent);padding:1px 9px;border-radius:999px}
.subh{margin:12px 0 8px;font-size:13px;font-weight:800;color:var(--muted)}
.ucs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.uc{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);transition:border-color .15s,box-shadow .15s,transform .15s}
.uc:hover{border-color:var(--accent);box-shadow:0 8px 20px rgba(14,61,44,.12);transform:translateY(-1px)}
.uc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.uc .ic{width:34px;height:34px;flex-shrink:0;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.uc .ic svg{width:19px;height:19px}
.uc b{flex:1;min-width:0;font-size:14.5px;font-weight:800;line-height:1.4}
.uc .arw,.dsh .arw{color:var(--accent);display:flex;flex-shrink:0}
.dashes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dsh{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:var(--accent);color:var(--on-accent)}
.dsh:hover{background:var(--accent-hover)}
.dsh .ic{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dsh .tx{flex:1;min-width:0;display:flex;flex-direction:column}.dsh b{font-size:15px;font-weight:800}.dsh small{font-size:12.5px;opacity:.85}
.dsh .arw{color:var(--on-accent)}
.none{color:var(--muted);margin-top:18px}
@media (max-width:640px){.admins,.dashes{grid-template-columns:1fr}.adm{min-height:0}.srch{flex-basis:100%}.ucs{grid-template-columns:1fr 1fr;gap:8px}.uc{padding:10px;gap:8px}.uc .ic{width:30px;height:30px}.uc .arw{display:none}.uc b{font-size:13.5px}.card.wide{padding:28px 16px}.big{font-size:24px}}
.lbl{width:100%;margin-top:20px;text-align:start;font-size:13px;font-weight:800;color:var(--muted)}
.lbl + .units{margin-top:8px}
.out{all:unset;cursor:pointer;margin-top:18px;font-size:13px;font-weight:700;color:var(--muted)}
.out:hover{color:var(--accent);text-decoration:underline}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* أطراف واضحة باللون الأخضر الغامق (تبقى ظاهرة على الشاشات الفاتحة) */
.unit{border:2px solid var(--edge)!important;background:var(--surface)!important}
.unit:hover{border-color:var(--accent)!important}

/* الشُّعب: خانات منبثقة تُفتح بالضغط وتظهر تحتها المراكز */
.tree{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:8px}
.tree>.units{margin-top:0}
a.gbar{text-decoration:none}
.grp{width:100%}
.gbar{all:unset;box-sizing:border-box;text-align:start;cursor:pointer;width:100%;display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:14px;border:2px solid var(--edge);background:var(--surface);color:var(--text);transition:border-color .15s,box-shadow .15s}
.gbar:hover{border-color:var(--accent);box-shadow:0 8px 22px rgba(14,61,44,.14)}
.gbar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gbar .ic{width:40px;height:40px;flex-shrink:0;border-radius:11px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.gbar .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gbar b{font-size:17px;font-weight:800}
.gbar small{font-size:13px;color:var(--muted)}
.gbar .go{flex-shrink:0;font-size:13px;font-weight:700;color:var(--accent)}
.gbar .chev{flex-shrink:0;transition:transform .2s;color:var(--accent)}
.gbar[aria-expanded="true"] .chev{transform:rotate(180deg)}
.gbar[aria-expanded="true"]{border-color:var(--accent);border-end-start-radius:0;border-end-end-radius:0}
.gbody{border:2px solid var(--accent);border-top:0;border-radius:0 0 14px 14px;padding:14px;background:var(--surface-2)}
.gbody[hidden]{display:none}
.gbody .units{margin-top:0}
.unit.soon{cursor:default;border-style:dashed!important;opacity:.8}
.unit.soon:hover{transform:none;box-shadow:none;border-color:var(--edge)!important}
.unit .soonb{margin-top:auto;font-size:12.5px;font-weight:700;color:var(--muted)}
</style>
</head>
<body>
<main class="page">
  <div class="band">سرّي — محظور التداول — مقصور استخدامه على منسوبي الدفاع المدني</div>

  <section class="card wide" id="choose">
    <div class="logo" id="logo2"></div>
    <h1 class="big">بوابة الإدارة العامة للدفاع المدني في حائل</h1>
    <div class="sub">اختر الإدارة ثم الجهة</div>
    <div class="tree" id="units" aria-label="الجهات"></div>
    <button type="button" class="out" id="out" hidden>تسجيل الخروج من جميع الجهات</button>
  </section>
</main>

<script>/*CONFIG*/</script>
<script>
(function () {
  const cfg = window.ISNAD_CONFIG || {};
  const $ = (s) => document.getElementById(s);
  const esc = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ss = {
    get: (k) => { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} },
    del: (k) => { try { sessionStorage.removeItem(k); } catch (e) {} },
  };
  const shield = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0E3D2C" stroke-width="2" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V5l-8-3Z"/></svg>';
  const logo = cfg.logo ? `<img src="${esc(cfg.logo)}" alt="شعار الدفاع المدني">` : shield;
  $('logo2').innerHTML = logo;
  const icons = {
    isnad: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="1" y="7" width="15" height="11" rx="1.5"/><path d="M16 10h3l3 3v5h-6z"/><circle cx="6" cy="19.5" r="1.8"/><circle cx="17.5" cy="19.5" r="1.8"/></svg>',
    control: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2" y="14" width="5" height="7" rx="1.5"/><rect x="17" y="14" width="5" height="7" rx="1.5"/><path d="M19.5 21a4 4 0 0 1-4 2H13"/></svg>',
    other: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg>',
  };
  // الهيكل: شعبة الجنوب، شعبة الشمال، مركز المواد الخطرة، قسم الدعم والإسناد، ثم المراكز الخارجية (بلا صفحات بعد)
  const byId = {}; (cfg.units || []).forEach((u) => (byId[u.id] = u));
  const card = (u) => `<a class="unit" href="${esc(u.id)}.html"><span class="ic">${icons[u.id] || icons.other}</span><b>${esc(u.name)}</b><span class="go">دخول ←</span></a>`;
  const soon = (n) => `<div class="unit soon" aria-disabled="true"><span class="ic">${icons.other}</span><b>${esc(n)}</b><span class="soonb">قريباً</span></div>`;
  const CHEV = '<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  const FOLD = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
  const group = (id, title, sub, inner) => `<div class="grp"><button type="button" class="gbar" data-g="${id}" aria-expanded="false" aria-controls="gb-${id}"><span class="ic">${FOLD}</span><span class="tx"><b>${esc(title)}</b><small>${esc(sub)}</small></span>${CHEV}</button><div class="gbody" id="gb-${id}" hidden><nav class="units" aria-label="${esc(title)}">${inner}</nav></div></div>`;
  const pick = (ids) => ids.filter((i) => byId[i]).map((i) => card(byId[i])).join('');
  const south = ['sharaf', 'sinaiya', 'dairi', 'jabal'], north = ['balad', 'muntazah', 'aziziya', 'aja'];
  // ---------- تنقّل بمستويين: الإدارات ← صفحة الإدارة (أقسام مرتبة + بحث) ----------
  const ARW = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>';
  const IC = {
    chart: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>',
    ops: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2c2 3 6 5 6 10a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3 0-5 1-7Z"/></svg>',
    safety: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>',
    doc: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  };
  const uc = (id, label) => byId[id] ? `<a class="uc" href="${esc(id)}.html" data-q="${esc(label || byId[id].name)}"><span class="ic">${icons[id] || (id.length > 5 && /^sf/.test(id) ? IC.doc : icons.other)}</span><b>${esc(label || byId[id].name)}</b><span class="arw">${ARW}</span></a>` : '';
  const block = (title, cards) => { const n = (cards.match(/class="uc"/g) || []).length; return n ? `<section class="blk"><h3>${esc(title)}<span class="cnt">${n}</span></h3><div class="ucs">${cards}</div></section>` : ''; };
  const sub = (title, cards) => cards ? `<div class="subh">${esc(title)}</div><div class="ucs">${cards}</div>` : '';
  const many = (ids) => ids.map((i) => uc(i)).join('');
  const lk = (href, label, ic) => `<a class="uc" href="${esc(href)}" data-q="${esc(label)}"><span class="ic">${ic || IC.doc}</span><b>${esc(label)}</b><span class="arw">${ARW}</span></a>`;
  const SFN = { sfn: 'قسم السلامة شمال', sfs: 'قسم السلامة جنوب' };
  const sfView = (k) => (byId[k + 'pat'] ? block('قسم الدوريات', lk(k + 'pat.html#rounds', 'الجولات التفتيشية') + lk(k + 'pat.html#sfstat', 'الإحصائيات', IC.chart) + lk(k + 'pat.html#pfiles', 'ملفات أفراد قسم الدوريات')) : '')
    + (byId[k + 'lic'] ? block('قسم التراخيص', lk(k + 'lic.html#lfac', 'المنشآت والتراخيص') + lk(k + 'lic.html#sfstat', 'إحصائيات الشعبة', IC.chart) + lk(k + 'lic.html#pfiles', 'ملفات أفراد القسم')) : '');
  const VIEWS = {
    ops: () => {
      const dash = cfg.manager ? `<section class="blk"><h3>لوحات القيادة</h3><div class="dashes">
        <a class="dsh" href="manager.html"><span class="ic">${IC.chart}</span><span class="tx"><b>${esc(cfg.manager.name)}</b><small>جاهزية كل المراكز والأقسام</small></span><span class="arw">${ARW}</span></a>
        <a class="dsh" href="ops.html"><span class="ic">${IC.chart}</span><span class="tx"><b>لوحة مدير إدارة العمليات</b><small>جاهزية كل المراكز والأقسام</small></span><span class="arw">${ARW}</span></a></div></section>` : '';
      const centers = `<section class="blk"><h3>المراكز<span class="cnt">${[...south, ...north, 'rawda', 'jubba', 'khatta'].filter((i) => byId[i]).length}</span></h3>${sub('شعبة الجنوب', many(south))}${sub('شعبة الشمال', many(north))}${sub('المراكز الخارجية', many(['rawda', 'jubba', 'khatta']))}</section>`;
      return dash + centers + block('الأقسام المتخصصة', many(['hazmat', 'isnad', 'control'])) + block('الأقسام الإدارية', many(['supply', 'admaff', 'techaff', 'hrdiv']));
    },
    // إدارة السلامة: قسم السلامة شمال وجنوب، وبداخل كل منهما قسم الدوريات وقسم التراخيص بقوائمهما (كل قسم بدخوله)
    safety: () => `<section class="blk"><div class="ucs">${['sfn', 'sfs'].map((k) => lk('#' + k, SFN[k], IC.safety)).join('')}</div></section>`,
    sfn: () => sfView('sfn'),
    sfs: () => sfView('sfs'),
  };
  const TITLES = { ops: ['إدارة العمليات', 'المراكز والأقسام ولوحات القيادة'], safety: ['إدارة السلامة', 'قسم السلامة شمال · قسم السلامة جنوب'], sfn: ['قسم السلامة شمال', 'قسم الدوريات · قسم التراخيص'], sfs: ['قسم السلامة جنوب', 'قسم الدوريات · قسم التراخيص'] };
  const PARENT = { sfn: ['#safety', 'إدارة السلامة'], sfs: ['#safety', 'إدارة السلامة'] };
  const home = () => `<div class="admins">
      <a class="adm" href="#ops"><span class="ic">${IC.ops}</span><b>إدارة العمليات</b><small>11 مركزًا · 3 أقسام متخصصة · 4 أقسام إدارية · لوحات القيادة</small><span class="go">فتح ${ARW}</span></a>
      <a class="adm" href="#safety"><span class="ic">${IC.safety}</span><b>إدارة السلامة</b><small>قسم السلامة شمال · قسم السلامة جنوب</small><span class="go">فتح ${ARW}</span></a>
    </div>`;
  const draw = () => {
    const v = (location.hash || '').slice(1);
    if (!VIEWS[v]) { $('units').innerHTML = home(); return; }
    $('units').innerHTML = `<div class="vhead"><a class="back" href="${(PARENT[v] || ['#'])[0]}">→ ${(PARENT[v] || [0, 'الإدارات'])[1]}</a><div class="vt"><h2>${TITLES[v][0]}</h2><small>${TITLES[v][1]}</small></div>
      <label class="srch"><span class="vh">بحث</span><input id="uq" type="search" placeholder="ابحث عن مركز أو قسم…" autocomplete="off"></label></div><div id="vbody">${VIEWS[v]()}</div><p class="none" id="nores" hidden>لا توجد نتائج مطابقة.</p>`;
    const q = $('uq');
    q.addEventListener('input', () => {
      const t = q.value.trim().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه');
      let shown = 0;
      document.querySelectorAll('#vbody .uc, #vbody .dsh').forEach((a) => { const ok = !t || (a.dataset.q || a.textContent).replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').includes(t); a.hidden = !ok; if (ok) shown++; });
      document.querySelectorAll('#vbody .ucs, #vbody .dashes').forEach((g) => { g.hidden = ![...g.children].some((c) => !c.hidden); const h = g.previousElementSibling; if (h && h.classList.contains('subh')) h.hidden = g.hidden; });
      document.querySelectorAll('#vbody .blk').forEach((b) => { b.hidden = !b.querySelector('.uc:not([hidden]), .dsh:not([hidden])'); });
      $('nores').hidden = shown > 0;
    });
  };
  window.addEventListener('hashchange', () => { draw(); window.scrollTo(0, 0); });
  draw();


  // البوابة بلا كلمة مرور؛ كل جهة تطلب كلمتها عند دخولها. زر الخروج يظهر إن كانت أي جهة مفتوحة
  const authKeys = () => {
    const out = [];
    try {
      for (let i = 0; i < sessionStorage.length; i++) if (/^isnad-auth-/.test(sessionStorage.key(i))) out.push(sessionStorage.key(i));
    } catch (e) {}
    return out;
  };
  function show() {
    $('out').hidden = !authKeys().length;
  }

  $('out').addEventListener('click', () => {
    authKeys().forEach(ss.del);
    ss.del('isnad-entered');
    if (cfg.mode === 'server') fetch('logout', { method: 'POST' });
    show();
  });

  show();
})();
</script>
</body>
</html>
