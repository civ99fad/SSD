<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بوابة الإدارة العامة للدفاع المدني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#0E3D2C; --surface:#FFFFFF; --surface-2:#F7F9F8; --line:#E3E8E5;
  --text:#14201B; --muted:#56635D; --faint:#7C8983;
  --accent:#1F7A56; --accent-hover:#17694A; --on-accent:#FFFFFF; --accent-soft:#E4F1EA;
  --danger:#B42318; --danger-bg:#FDECEA; --shadow:0 30px 60px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A2A1F; --surface:#151D1A; --surface-2:#19231F; --line:#26322D;
    --text:#E6ECE9; --muted:#A3B0AA; --faint:#7F8C86;
    --accent:#45A980; --accent-hover:#5BBB93; --on-accent:#05130D; --accent-soft:#16352A;
    --danger:#F97066; --danger-bg:#3A1714;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A2A1F; --surface:#151D1A; --surface-2:#19231F; --line:#26322D;
  --text:#E6ECE9; --muted:#A3B0AA; --faint:#7F8C86;
  --accent:#45A980; --accent-hover:#5BBB93; --on-accent:#05130D; --accent-soft:#16352A;
  --danger:#F97066; --danger-bg:#3A1714;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{font-family:'Tajawal',"Segoe UI",Tahoma,system-ui,sans-serif;color:var(--text);line-height:1.55;font-size:15px}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:72px 16px 48px;position:relative;overflow:hidden}
.page::before{content:"";position:absolute;inset:0;background:radial-gradient(560px 560px at 85% 12%,rgba(255,255,255,.06),transparent 70%),radial-gradient(480px 480px at 8% 92%,rgba(255,255,255,.05),transparent 70%);pointer-events:none}
.band{position:absolute;top:0;left:0;right:0;background:#B42318;color:#fff;text-align:center;font-size:13px;font-weight:800;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));z-index:1}
.card{position:relative;width:100%;max-width:440px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:40px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.card.wide{max-width:980px}
.logo{width:92px;height:92px;border-radius:50%;background:#fff;border:1px solid #E6ECE9;display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden}
.logo img{width:80px;height:80px;object-fit:contain}
h1{margin:0;font-size:24px;font-weight:800;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.fld{width:100%;margin-top:22px;text-align:start}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.fld input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-size:15px;outline:none}
.fld input:focus{border-color:var(--accent)}
.err{display:none;margin-top:8px;color:var(--danger);font-size:13.5px;font-weight:600}
.btn{width:100%;margin-top:14px;padding:14px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700;cursor:pointer;min-height:48px}
.btn:hover{background:var(--accent-hover)}
.btn[disabled]{opacity:.6;cursor:progress}
.foot{margin-top:22px;font-size:12px;color:var(--faint)}
.units{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));grid-auto-rows:1fr;gap:12px;margin-top:22px}
.unit{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;padding:16px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);min-height:118px;transition:border-color .15s,box-shadow .15s,transform .15s}
.unit:hover{border-color:var(--accent);box-shadow:0 10px 26px rgba(14,61,44,.14);transform:translateY(-2px)}
.unit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.unit .ic{width:40px;height:40px;flex-shrink:0;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.unit b{font-size:17px;font-weight:800}
.unit small{font-size:13px;color:var(--muted)}
.unit .go{margin-top:auto;font-size:13px;font-weight:700;color:var(--accent)}
.out{all:unset;cursor:pointer;margin-top:18px;font-size:13px;font-weight:700;color:var(--muted)}
.out:hover{color:var(--accent);text-decoration:underline}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <div class="band">سرّي — محظور التداول — مقصور استخدامه على منسوبي الدفاع المدني</div>

  <section class="card wide" id="choose">
    <div class="logo" id="logo2"></div>
    <h1>بوابة الإدارة العامة للدفاع المدني</h1>
    <div class="sub">اختر الجهة</div>
    <nav class="units" id="units" aria-label="الجهات"></nav>
    <button type="button" class="out" id="out" hidden>تسجيل الخروج من جميع الجهات</button>
  </section>
</main>

<script>/*CONFIG*/</script>
<script>
(function () {
  const cfg = window.ISNAD_CONFIG || {};
  const $ = (s) => document.getElementById(s);
  const esc = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ss = {
    get: (k) => { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} },
    del: (k) => { try { sessionStorage.removeItem(k); } catch (e) {} },
  };
  const shield = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0E3D2C" stroke-width="2" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V5l-8-3Z"/></svg>';
  const logo = cfg.logo ? `<img src="${esc(cfg.logo)}" alt="شعار الدفاع المدني">` : shield;
  $('logo2').innerHTML = logo;
  const icons = {
    isnad: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="1" y="7" width="15" height="11" rx="1.5"/><path d="M16 10h3l3 3v5h-6z"/><circle cx="6" cy="19.5" r="1.8"/><circle cx="17.5" cy="19.5" r="1.8"/></svg>',
    other: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg>',
  };
  // كل الجهات بخانات متساوية (القسم أولًا ثم المراكز)
  $('units').innerHTML = (cfg.units || [])
    .map((u) => `<a class="unit" href="${esc(u.id)}.html"><span class="ic">${icons[u.id] || icons.other}</span><b>${esc(u.name)}</b><span class="go">دخول ←</span></a>`)
    .join('');

  // البوابة بلا كلمة مرور؛ كل جهة تطلب كلمتها عند دخولها. زر الخروج يظهر إن كانت أي جهة مفتوحة
  const authKeys = () => {
    const out = [];
    try {
      for (let i = 0; i < sessionStorage.length; i++) if (/^isnad-auth-/.test(sessionStorage.key(i))) out.push(sessionStorage.key(i));
    } catch (e) {}
    return out;
  };
  function show() {
    $('out').hidden = !authKeys().length;
  }

  $('out').addEventListener('click', () => {
    authKeys().forEach(ss.del);
    ss.del('isnad-entered');
    if (cfg.mode === 'server') fetch('logout', { method: 'POST' });
    show();
  });

  show();
})();
</script>
</body>
</html>
