<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>أرشيف قسم الدعم والإسناد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#F7F9F8; --line:#8DB3A1;--edge:#2F6B53; --line-2:#C6D9CF;
  --text:#14201B; --muted:#56635D; --faint:#7C8983;
  --brand:#0E3D2C; --brand-text:#EAF1EE; --brand-muted:#A9C2B7; --brand-line:rgba(255,255,255,.1);
  --accent:#1F7A56; --accent-hover:#17694A; --on-accent:#FFFFFF; --accent-soft:#E4F1EA;
  --chip:#EDF2EF; --chip-text:#0E3D2C;
  --ok:#1F7A56; --ok-bg:#E4F1EA; --gold:#8A6410; --gold-bg:#FBF1DA; --neutral-bg:#EDF0EF; --neutral:#4B5752;
  --danger:#B42318; --danger-bg:#FDECEA;
  --shadow:0 10px 26px rgba(14,61,44,.12);
  --scrim:rgba(8,24,18,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1311; --surface:#151D1A; --surface-2:#19231F; --line:#33463E;--edge:#3E7A62; --line-2:#1F2A26;
    --text:#E6ECE9; --muted:#A3B0AA; --faint:#7F8C86;
    --brand:#0A2A1F; --brand-text:#E6EFEB; --brand-muted:#93AFA3; --brand-line:rgba(255,255,255,.08);
    --accent:#45A980; --accent-hover:#5BBB93; --on-accent:#05130D; --accent-soft:#16352A;
    --chip:#1E2A25; --chip-text:#CFE3DA;
    --ok:#6CC49D; --ok-bg:#16352A; --gold:#E2BA5E; --gold-bg:#3A2F14; --neutral-bg:#222C28; --neutral:#B4C0BA;
    --danger:#F97066; --danger-bg:#3A1714;
    --shadow:0 10px 26px rgba(0,0,0,.4);
    --scrim:rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1311; --surface:#151D1A; --surface-2:#19231F; --line:#33463E;--edge:#3E7A62; --line-2:#1F2A26;
  --text:#E6ECE9; --muted:#A3B0AA; --faint:#7F8C86;
  --brand:#0A2A1F; --brand-text:#E6EFEB; --brand-muted:#93AFA3; --brand-line:rgba(255,255,255,.08);
  --accent:#45A980; --accent-hover:#5BBB93; --on-accent:#05130D; --accent-soft:#16352A;
  --chip:#1E2A25; --chip-text:#CFE3DA;
  --ok:#6CC49D; --ok-bg:#16352A; --gold:#E2BA5E; --gold-bg:#3A2F14; --neutral-bg:#222C28; --neutral:#B4C0BA;
  --danger:#F97066; --danger-bg:#3A1714;
  --shadow:0 10px 26px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.65);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:'Tajawal',"Segoe UI",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.55;color:var(--text);direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
[hidden]{display:none!important}
.panel[style*="overflow-x"]{position:relative}
.panel[style*="overflow-x"] td.nm{min-width:150px}
.panel[style*="overflow-x"] th{white-space:nowrap}
.hstaff td.nm{white-space:nowrap}
.hstaff td,.hstaff th{padding-inline:12px}
.panel[style*="overflow-x"] td .stpill{white-space:nowrap}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- welcome ---------- */
.welcome{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:48px;padding-inline:16px;background:#0E3D2C;position:relative;overflow:hidden}
.welcome::before{content:"";position:absolute;inset:0;background:radial-gradient(560px 560px at 85% 12%,rgba(255,255,255,.06),transparent 70%),radial-gradient(480px 480px at 8% 92%,rgba(255,255,255,.05),transparent 70%)}
.wcard{position:relative;width:100%;max-width:440px;background:var(--surface);border-radius:20px;box-shadow:0 30px 60px rgba(0,0,0,.35);padding:44px 36px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.wlogo{width:92px;height:92px;border-radius:50%;background:#fff;border:1px solid #E6ECE9;display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden}
.wlogo img{width:80px;height:80px;object-fit:contain}
.wcard h1{font-size:24px;font-weight:800}
.wcard .sub{color:var(--muted);font-size:14px}
.wcard .hello{margin-top:22px;font-size:15px;font-weight:700}
.wcard .btn{width:100%;margin-top:14px;padding:14px;font-size:16px}
.wcard .foot{margin-top:24px;font-size:12px;color:var(--faint)}
.wcard .restrict{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;font-weight:700;color:var(--danger);background:var(--danger-bg);border-radius:20px;padding:3px 11px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--brand);color:var(--brand-text);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;padding:26px 18px;gap:28px}
.brand{display:flex;align-items:center;gap:11px;padding-inline:4px}
.brand-mark{width:40px;height:40px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;padding:3px;flex-shrink:0;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand b{display:block;font-size:15px;font-weight:800;color:#F2F6F4}
.brand small{display:block;font-size:11.5px;color:var(--brand-muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:#C9D8D1;font-weight:600;font-size:14.5px;border-inline-start:3px solid transparent}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:rgba(79,190,142,.16);color:#fff;font-weight:700;border-inline-start-color:#4FBE8E}
.nav button:focus-visible{outline:2px solid #4FBE8E;outline-offset:1px}
.nav svg{flex-shrink:0}
.side-foot{margin-top:auto;border-top:1px solid var(--brand-line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
/* الشاشات القصيرة (مثل لابتوب ١٣ إنش): القائمة تتمرر داخلها، وأسفلها (المستخدم والتعديل وتسجيل الخروج) ثابت ظاهر دائمًا */
@media (min-width:861px){
  /* القائمة اليمنى تتمرر وحدها بالماوس (ولا تحرّك الصفحة)، وارتفاعها = الجزء الظاهر فعلًا من النافذة */
  .side{height:100vh;height:100dvh;height:var(--app-h,100dvh);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
  .side > *{flex-shrink:0}
}
@media (min-width:861px) and (max-height:820px){
  .side{padding:16px 14px;gap:14px}
  .nav button{padding:8px 12px}
  .side .navh{padding:8px 14px 2px}
  .side-foot{padding-top:10px;gap:4px}
}
.who{display:flex;align-items:center;gap:10px;padding-inline:6px}
.who img{width:30px;height:30px;border-radius:50%;flex-shrink:0}
.who span{font-size:13px;font-weight:700;color:#E6EFEB;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who em{display:block;font-style:normal;font-weight:500;font-size:11.5px;color:var(--brand-muted)}
.logout{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#C9D8D1;font-size:13.5px;font-weight:600}
.logout:hover{background:rgba(255,255,255,.06)}
.logout:focus-visible{outline:2px solid #4FBE8E}
.main{padding-block:30px 60px;padding-inline:40px;min-width:0}
.wrap{max-width:1180px;margin-inline:auto;display:flex;flex-direction:column;gap:26px}

/* ---------- common ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;min-height:42px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[disabled]{opacity:.6;cursor:progress}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:none;background:transparent;color:var(--faint);cursor:pointer}
.icon-btn:hover{background:var(--chip);color:var(--text)}
.icon-btn.del:hover{background:var(--danger-bg);color:var(--danger)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.libnote{margin:0 0 14px;padding:10px 14px;border-radius:12px;background:#FEF6E0;border:1px solid #F5D98B;color:#7A5200;font-size:13.5px;font-weight:600;line-height:1.6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .libnote{background:#3A2A0C;border-color:#6B4E14;color:#F5C76B}}
:root[data-theme="dark"] .libnote{background:#3A2A0C;border-color:#6B4E14;color:#F5C76B}
.ssteps{margin:8px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;line-height:1.7}
.bmap{padding:0;overflow:hidden}
.bmap iframe{display:block;width:100%;height:min(70vh,640px);min-height:360px;border:0;background:var(--surface-2)}
.bmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px}
.bdesc{margin:0;flex:1 1 100%;white-space:pre-line}
.bmeta a.btn{text-decoration:none;color:var(--text)}
.ph-t{display:flex;align-items:center;gap:12px}
.ph h1{font-size:26px;font-weight:800}
.count{background:var(--chip);color:var(--muted);font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:20px}
.search{position:relative;display:block;max-width:440px;flex:1 1 260px}
.search input{width:100%;padding:11px 42px 11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:14.5px;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.plate{background:var(--chip);color:var(--chip-text);font-size:12px;font-weight:700;padding:3px 10px;border-radius:7px;letter-spacing:.3px;white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.sec{display:flex;flex-direction:column;gap:12px}
.sh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sh h2{font-size:17px;font-weight:800}
.sh .muted{font-size:12.5px;color:var(--faint)}
.sh .grow{flex:1}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.state{padding:60px 20px;text-align:center;color:var(--muted)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--faint);flex-wrap:wrap}
.crumbs button{all:unset;cursor:pointer;color:var(--faint)}
.crumbs button:hover{color:var(--accent);text-decoration:underline}
.crumbs button:focus-visible{outline:2px solid var(--accent)}
.crumbs span:last-child{color:var(--text);font-weight:600}
.link{color:var(--accent);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
button.link{background:none;border:none;padding:4px 0;cursor:pointer;font-family:inherit}
button.link:hover{text-decoration:underline}
.mbox.viewer{max-width:980px;padding:0;display:flex;flex-direction:column;overflow:hidden}
.vhd{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mbox .vhd h2{margin:0;flex:1 1 200px;font-size:16px;overflow-wrap:anywhere}
.vwbody{overflow:auto;padding:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:12px;min-height:200px}
.vwbody canvas,.vwbody img{display:block;width:100%;height:auto;background:#fff;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.vwbody .state{padding:40px 16px}
.docx-prev{background:#fff;color:#111;padding:28px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.12);overflow-x:auto;font-size:14px;line-height:1.6}
.docx-prev table{border-collapse:collapse;width:100%;margin:10px 0}
.docx-prev td,.docx-prev th{border:1px solid #999;padding:5px 8px;background:#fff;color:#111;font-size:13px}
.docx-prev p{margin:4px 0}
.docx-prev img{max-width:100%;box-shadow:none}
.docx-note{margin:0;font-size:12.5px;color:var(--faint)}
a.link:hover{text-decoration:underline}

/* ---------- vehicle cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.vcard{all:unset;cursor:pointer;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:box-shadow .15s,transform .15s}
.vcard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.vcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vthumb{height:160px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--faint)}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vbody{padding:15px 16px 16px;display:flex;flex-direction:column;gap:9px}
.vname{font-size:16px;font-weight:800}
.vmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.stpill.hs-ok{background:var(--ok-bg);color:var(--ok)}
.stpill.hs-bad{background:var(--danger-bg);color:var(--danger)}
.stpill.hs-in{background:var(--chip);color:var(--chip-text)}
.stpill.hs-mid{background:var(--gold-bg);color:var(--gold)}
.dot.hd-ok,.rbar .hd-ok{background:var(--ok)}
.dot.hd-bad,.rbar .hd-bad{background:var(--danger)}
.dot.hd-mid,.rbar .hd-mid{background:var(--gold)}
.htabs{display:flex;gap:2px;border-bottom:1.5px solid var(--line);overflow-x:auto;scrollbar-width:none}
.htab{all:unset;cursor:pointer;padding:11px 16px;font-weight:700;font-size:14.5px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.htab:hover{color:var(--text)}
.htab.on{color:var(--accent);border-bottom-color:var(--accent)}
.htab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.htab b{background:var(--chip);color:var(--muted);font-size:12px;padding:1px 8px;border-radius:10px;font-variant-numeric:tabular-nums}
.htab.on b{background:var(--accent-soft);color:var(--accent)}
tr.vac td{color:var(--faint);font-size:13.5px}
.hper{font-size:12.5px;color:var(--muted)}
.hmut{color:var(--faint)}
td.hdate{white-space:nowrap;font-variant-numeric:tabular-nums}
td.hnum{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.5px}
td.ra.wide{width:auto}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px}
.chk{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:transparent;cursor:pointer;font-family:inherit}
span.chk{cursor:default}
button.chk:hover{border-color:var(--ok);color:var(--ok)}
.chk.on{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
button.chk.on:hover{color:var(--on-accent);opacity:.85}
.chk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
tr.nextrow td{background:var(--gold-bg)}
.nextb{display:inline-block;font-size:11.5px;font-weight:700;color:var(--gold);border:1px solid currentColor;border-radius:6px;padding:1px 7px;margin-inline-start:6px}
.icon-btn:disabled{opacity:.3;cursor:default;background:transparent}
.rvbadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--gold);background:var(--gold-bg);padding:2px 8px;border-radius:6px}
.rvbox{background:var(--gold-bg);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:14px;padding:14px 16px;margin-top:16px}
.rvbox h2{font-size:15px;margin:0 0 8px;color:var(--gold);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rvbox ul{margin:0;padding-inline-start:20px;display:grid;gap:4px;color:var(--text);font-size:14px}
.tlflag{font-size:12.5px;color:var(--gold);font-weight:600;margin-top:4px}
.vfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}

.vthumb{position:relative}
/* status */
.stpill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.stpill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.stpill.st-ready{background:var(--ok-bg);color:var(--ok)}
.stpill.st-down{background:var(--danger-bg);color:var(--danger)}
.stpill.st-none{background:var(--neutral-bg);color:var(--neutral)}
.stpill.st-maint{background:var(--gold-bg);color:var(--gold)}
.stpill.st-away{background:#E6EEFD;color:#1D4ED8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stpill.st-away{background:#16233F;color:#9DBBFF}}
:root[data-theme="dark"] .stpill.st-away{background:#16233F;color:#9DBBFF}
.stnote{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.stpill.onimg{position:absolute;top:10px;right:10px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.info dd .stpill{font-size:13.5px}
/* readiness */
.ready{padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.rhead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.rtitle{font-size:14px;font-weight:700;color:var(--muted)}
.rbig{font-size:46px;font-weight:800;line-height:1.1;color:var(--ok);font-variant-numeric:tabular-nums}
.rbig.none{color:var(--faint)}
.duty{padding:18px 22px;display:flex;flex-direction:column;gap:12px;border-inline-start:4px solid var(--accent)}
.duty .dtop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.duty .dlbl{font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.duty .dlive{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-bg);padding:2px 10px;border-radius:20px}
.duty .dlive i{width:7px;height:7px;border-radius:50%;background:currentColor}
.duty .dname{font-size:28px;font-weight:800;color:var(--accent);line-height:1.2;margin-top:2px}
.duty .dtime{font-size:13.5px;color:var(--muted);margin-top:2px}
.duty .rstats dd.bad{color:var(--danger)}
.duty .dnext{margin:0;font-size:13px;color:var(--faint);border-top:1px solid var(--line);padding-top:10px}
.duty .dcases{border-top:1px solid var(--line);padding-top:10px}
.duty .dcases h3{margin:0 0 6px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.duty .dcases h3 b{background:var(--danger-bg);color:var(--danger);border-radius:20px;padding:0 9px;font-size:12.5px}
.duty .dcases ul{list-style:none;margin:0;padding:0}

.mf{position:absolute;box-sizing:border-box;display:flex;align-items:center;font-family:'Tajawal',"Segoe UI",Tahoma,sans-serif;font-weight:700;font-size:calc(var(--fs) * var(--k,1));line-height:1.15;color:#000;white-space:nowrap;overflow:hidden;padding:0 .35cqw;background:rgba(255,224,102,.3);outline:1px dashed rgba(29,91,216,.5);border-radius:2px;cursor:text}

.mblank .mf{background:none;outline:none;cursor:default}.mblank .mf:empty::before{content:none}.mblank .mck{cursor:default}
@media print{
  body.medit-on>*:not(#medit){display:none!important}

<script>
(function(){
const $ = s => document.querySelector(s);
const S = { db:null, user:null, assets:null, canEdit:false, me:null,
  vehicles:[], warehouses:[], settings:{}, loadedV:false, loadedW:false, dbFailed:false,
  view:{name:'dash'}, q:'', gq:'', wq:'', entered:false, staff:[], absences:[], rewards:[], missions:[], hrs:{}, hl:{}, loadedH:false, letters:[], ptx:[], tl:{}, loadedT:false };

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blob = id => id ? '/_blob/' + encodeURIComponent(id) : '';
const HF = (() => { try { return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}); } catch(e){ return null; } })();
const hijri = ts => { const d = new Date(ts || Date.now()); return HF ? HF.format(d) : d.toLocaleDateString('ar'); };

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>{t.hidden=true},2800); }
function errMsg(e){
  if (e && e.msg) return e.msg;
  const c = e && e.code;
  if (c==='docbig') return 'ملف Word كبير (الحد 180 كيلوبايت). احذف الصور الكبيرة من الملف أو صغّرها ثم ارفعه مجدداً.';
  if (c==='olddoc') return 'صيغة .doc القديمة غير مدعومة. افتح الملف في Word واحفظه بصيغة .docx ثم ارفعه.';
  if (c==='word') return 'ملفات Word لا تُرفع هنا. احفظ الملف بصيغة PDF ثم ارفعه.';
  if (c==='badtype' || c==='unsupported_type') return 'نوع الملف غير مدعوم. المسموح: صور (JPG أو PNG أو WEBP) أو PDF.';
  if (c==='too_large') return 'حجم الملف أكبر من المسموح (20 ميجابايت). صغّر الملف وحاول مجدداً.';
  if (c==='not_granted' || c==='invalid_argument') return 'ليست لديك صلاحية التعديل على هذا الموقع.';
  if (c==='quota_exceeded' || c==='quota_or_state') return 'امتلأت مساحة التخزين. احذف ملفات أو سجلات قديمة ثم حاول مجدداً.';
  if (c==='rate_limited' || c==='resource_exhausted') return 'طلبات كثيرة في وقت قصير. انتظر قليلاً ثم حاول مجدداً.';
  return 'تعذّر الحفظ. تحقق من الاتصال وحاول مجدداً.';
}
const ALLOWED = {jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',pdf:'application/pdf'};
async function upload(file){
  if (!S.assets) throw {code:'not_granted'};
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if (ext==='doc' || ext==='docx') throw {code:'word'};
  const type = ALLOWED[ext] || (Object.values(ALLOWED).includes(file.type) ? file.type : null);
  if (!type) throw {code:'badtype'};
  const r = await S.assets.upload(file, {type});
  return r.id;
}

/* ---------- modal ---------- */
let lastFocus = null;
function openModal(html, cls){
  lastFocus = document.activeElement;
  const m=$('#modal'); m.innerHTML=`<div class="mbox ${cls||''}" role="dialog" aria-modal="true" aria-labelledby="mt">${html}</div>`; m.hidden=false;
  const f = m.querySelector('input,select,textarea,button.primary,button'); if (f) f.focus();
}
function closeModal(){ S.lb=null; const m=$('#modal'); m.hidden=true; m.innerHTML=''; if(lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
function showPhoto(vid, key, idx, list){
  const v=ownGet(vid); const arr=list || ((v&&v[key])||[]);
  if (!arr.length){ closeModal(); return; }
  idx=((idx%arr.length)+arr.length)%arr.length;
  const reuse = S.lb && !$('#modal').hidden;
  S.lb={vid, key, idx};
  const n=arr.length, label=vid.startsWith('f:')?'صورة العطل':key==='contentPhotos'?'صورة المحتويات':'صورة الآلية';
  const chev = d => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="${d}"/></svg>`;
  const html=`<h2 id="mt" class="vh">${label}</h2>
    <div class="lbstage" id="lbstage"><img src="${blob(arr[idx])}" alt="${label} ${idx+1} من ${n}">
      ${n>1?`<button type="button" class="lbnav prev" data-act="lbPrev" aria-label="الصورة السابقة">${chev('m9 6 6 6-6 6')}</button><button type="button" class="lbnav next" data-act="lbNext" aria-label="الصورة التالية">${chev('m15 6-6 6 6 6')}</button>`:''}
    </div>
    <div class="mact"><span class="lbcount" aria-live="polite">${idx+1} / ${n}</span><span class="grow"></span>${S.canEdit?`<button type="button" class="btn danger" data-act="lbDel">${ICON.del}حذف الصورة</button>`:''}<button type="button" class="btn" data-act="closeModal">إغلاق</button></div>`;
  if (reuse){
    const a=document.activeElement, act=a&&a.dataset&&a.dataset.act;
    $('#modal .mbox').innerHTML=html;
    const f=act && $('#modal [data-act="'+act+'"]'); (f || $('#modal .lbnav.next') || $('#modal [data-act="closeModal"]')).focus();
  }
  else { openModal(html, 'lb'); const nx=$('#modal .lbnav.next'); if (nx) nx.focus(); }
  const st=$('#lbstage'); let x0=null;
  st.addEventListener('touchstart', e => { x0=e.touches[0].clientX; }, {passive:true});
  st.addEventListener('touchend', e => { if (x0==null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if (Math.abs(dx)>40) showPhoto(vid, key, S.lb.idx + (dx>0?1:-1)); });
}
function fieldHtml(f){
  const id='f_'+f.id, req=f.required?' required':'';
  let ctl;
  if (f.type==='select') ctl=`<select id="${id}">${f.options.map(o=>`<option value="${esc(o[0])}"${o[0]===f.value?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  else if (f.type==='textarea') ctl=`<textarea id="${id}" placeholder="${esc(f.placeholder||'')}"${req}>${esc(f.value||'')}</textarea>`;
  else if (f.type==='file') ctl=`<input id="${id}" type="file" accept="${esc(f.accept||'')}"${req}>`;
  else ctl=`<input id="${id}" type="${f.type||'text'}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}" autocomplete="off"${f.list?` list="${id}_dl"`:''}${req}>${f.list?`<datalist id="${id}_dl">${f.list.map(o=>`<option value="${esc(o)}"></option>`).join('')}</datalist>`:''}`;
  return `<div class="fld"><label for="${id}">${esc(f.label)}</label>${ctl}${f.hint?`<small>${esc(f.hint)}</small>`:''}</div>`;
}
function openForm({title, fields, submit='حفظ', onSubmit}){
  const body = fields.map(f => Array.isArray(f) ? `<div class="row2">${f.map(fieldHtml).join('')}</div>` : fieldHtml(f)).join('');
  openModal(`<h2 id="mt">${esc(title)}</h2><form id="mf" novalidate>${body}<p class="ferr" id="ferr" hidden></p><div class="mact"><button type="submit" class="btn primary" id="msub">${esc(submit)}</button><button type="button" class="btn" data-act="closeModal">إلغاء</button></div></form>`);
  const flat = fields.flat();
  $('#mf').addEventListener('submit', async e => {
    e.preventDefault();
    const vals={}, err=$('#ferr');
    for (const f of flat){
      const el=document.getElementById('f_'+f.id);
      vals[f.id] = f.type==='file' ? (el.files[0]||null) : el.value.trim();
      if (f.required && !vals[f.id]){ err.textContent='أكمل الحقل: '+f.label; err.hidden=false; el.focus(); return; }
    }
    const b=$('#msub'); b.disabled=true; const old=b.textContent; b.textContent='جارٍ الحفظ…';
    try { await onSubmit(vals); closeModal(); }
    catch(x){ err.textContent=errMsg(x); err.hidden=false; b.disabled=false; b.textContent=old; }
  });
}
function openConfirm(text, yesLabel, onYes, title='تأكيد الحذف'){
  openModal(`<h2 id="mt">${esc(title)}</h2><p>${esc(text)}</p><p class="ferr" id="ferr" hidden></p><div class="mact"><button type="button" class="btn danger-solid" id="cyes">${esc(yesLabel)}</button><button type="button" class="btn" data-act="closeModal">إلغاء</button></div>`);
  $('#cyes').addEventListener('click', async () => {
    const b=$('#cyes'); b.disabled=true;
    try { await onYes(); closeModal(); } catch(x){ const e=$('#ferr'); e.textContent=errMsg(x); e.hidden=false; b.disabled=false; }
  });
}

/* ---------- document viewer ---------- */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
let pdfReady=null;
function loadPdfjs(){
  if (!pdfReady) pdfReady = (async () => {
    const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    await loadScript(base+'pdf.min.js');
    await loadScript(base+'pdf.worker.min.js'); /* runs the parser in-page: the frame cannot start a cross-origin worker */
  })().catch(e => { pdfReady=null; throw e; });
  return pdfReady;
}
const EXT = {'application/pdf':'pdf','image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'};
async function openViewer(fid, name){
  openModal(`<div class="vhd"><h2 id="mt">${esc(name)}</h2><div class="mact">${S.downloads?`<button type="button" class="btn" id="vdl" disabled>${ICON.dl}تحميل</button>`:''}<button type="button" class="btn" data-act="closeModal">إغلاق</button></div></div><div class="vwbody" id="vwbody"><div class="state">جارٍ فتح المستند…</div></div>`, 'viewer');
  const vb=$('#vwbody'); const alive=()=>document.getElementById('vwbody')===vb;
  let b;
  try { const r=await fetch(blob(fid)); if(!r.ok) throw new Error(r.status); b=await r.blob(); }
  catch(e){ if(alive()) vb.innerHTML='<div class="state">تعذّر فتح المستند. ربما حُذف الملف، أو انقطع الاتصال. أعد المحاولة.</div>'; return; }
  if (!alive()) return;
  let head=''; try { head=await b.slice(0,5).text(); } catch(e){}
  const type = head.startsWith('%PDF') ? 'application/pdf' : (b.type||'');
  const dl=$('#vdl');
  if (dl){
    dl.disabled=false;
    dl.addEventListener('click', async () => {
      const ext=EXT[type]||'pdf'; let fn=String(name).trim(); if(!/\.[a-z0-9]{2,5}$/i.test(fn)) fn+='.'+ext;
      try { await S.downloads.save({filename:fn, data:b}); }
      catch(e){ if (e && e.code!=='declined') toast('تعذّر تحميل الملف في هذا العرض.'); }
    });
  }
  if (type!=='application/pdf'){
    const u=URL.createObjectURL(b); vb.innerHTML=`<img src="${u}" alt="${esc(name)}">`; return;
  }
  try {
    await loadPdfjs(); if (!alive()) return;
    const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await b.arrayBuffer()), isEvalSupported:false, disableFontFace:true, useSystemFonts:false}) /* رسم الخطوط المضمّنة كمسارات: يمنع تلخبط الحروف العربية */.promise;
    vb.innerHTML='';
    const dpr=Math.min(window.devicePixelRatio||1, 2);
    for (let i=1;i<=pdf.numPages;i++){
      if (!alive()) return;
      const pg=await pdf.getPage(i);
      const w=Math.max(320, vb.clientWidth-28);
      const vp=pg.getViewport({scale:(w/pg.getViewport({scale:1}).width)*dpr});
      const c=document.createElement('canvas'); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
      c.setAttribute('role','img'); c.setAttribute('aria-label', name+' — صفحة '+i);
      vb.appendChild(c);
      await pg.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
    }
  } catch(e){
    if (alive()) vb.innerHTML=`<div class="state">تعذّر عرض الملف هنا.${S.downloads?' استخدم زر «تحميل» لفتحه على جهازك.':''}</div>`;
  }
}

/* ---------- Word form (stored in the database, since the file store takes no .docx) ---------- */
const DOCX_MIME='application/vnd.openxmlformats-officedocument.wordprocessingml.document';
const DOCX_MAX=180*1024;
function toB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=rej; r.readAsDataURL(file); }); }
function b64Blob(b64, mime){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:mime}); }
const docxName = n => { n=String(n||'نموذج الاستلام والتسليم').trim(); return /\.docx$/i.test(n)?n:n+'.docx'; };
async function dbFileBlob(ref, fallback){
  const s=await S.db.doc('files/'+ref).get(); if(!s.exists) return null;
  const d=s.data(); return {blob:b64Blob(d.b64, d.mime||DOCX_MIME), name:docxName(d.name||fallback)};
}
async function formBlob(vid){
  const f=(getV(vid)||{}).form; if(!f||!f.db) return null;
  return dbFileBlob(f.db, f.name);
}
async function saveDocx(file){
  try { await S.downloads.save({filename:file.name, data:file.blob}); }
  catch(e){ if (e && e.code==='extension_not_enabled') toast('تحميل ملفات Word غير متاح في هذا العرض.'); else if (e && e.code!=='declined') toast('تعذّر تحميل الملف.'); }
}
let mammothReady=null;
function loadMammoth(){
  if (!mammothReady) mammothReady = loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js').catch(e=>{ mammothReady=null; throw e; });
  return mammothReady;
}
async function openFormViewer(vid){
  const f=(getV(vid)||{}).form; if(!f) return;
  if (!f.db) return openViewer(f.file, f.name||'نموذج الاستلام والتسليم');
  return openDocxViewer(f.db, f.name||'نموذج الاستلام والتسليم');
}
async function openDocxViewer(ref, title){
  openModal(`<div class="vhd"><h2 id="mt">${esc(title)}</h2><div class="mact">${S.downloads?`<button type="button" class="btn" id="vdl" disabled>${ICON.dl}تحميل</button>`:''}<button type="button" class="btn" data-act="closeModal">إغلاق</button></div></div><div class="vwbody" id="vwbody"><div class="state">جارٍ فتح الملف…</div></div>`, 'viewer');
  const vb=$('#vwbody'); const alive=()=>document.getElementById('vwbody')===vb;
  let file; try { file=await dbFileBlob(ref, title); } catch(e){}
  if (!alive()) return;
  if (!file){ vb.innerHTML='<div class="state">تعذّر فتح الملف. أعد المحاولة.</div>'; return; }
  const dl=$('#vdl'); if (dl){ dl.disabled=false; dl.addEventListener('click', ()=>saveDocx(file)); }
  try {
    await loadMammoth(); if (!alive()) return;
    const r=await window.mammoth.convertToHtml({arrayBuffer: await file.blob.arrayBuffer()});
    vb.innerHTML=`<div class="docx-prev" dir="rtl">${r.value}</div><p class="docx-note">معاينة للقراءة فقط، وقد يختلف التنسيق قليلاً عن Word. للتعديل: حمّل الملف وعدّله في Word ثم ارفعه من جديد.</p>`;
  } catch(e){
    if (alive()) vb.innerHTML=`<div class="state">تعذّرت معاينة ملف Word هنا.${S.downloads?' استخدم زر «تحميل» لفتحه في Word.':''}</div>`;
  }
}

/* ---------- equipment search across vehicle inventories and warehouses ---------- */
const DIG = s => String(s??'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c));
const words = s => norm(DIG(s)).replace(/[^\p{L}\p{N}.\s]/gu,' ').split(/\s+/).filter(Boolean).map(w=>w.length>3&&w.startsWith('ال')?w.slice(2):w);
function parseQty(q){
  const t=DIG(q).trim(); if(!t) return {n:null, unit:''};
  const m=t.match(/^(\d+(?:\.\d+)?)\s*(.*)$/); if(!m) return {n:null, unit:''};
  return {n:parseFloat(m[1]), unit:m[2].trim()};
}
function equipmentResults(query, onlyWarehouses){
  const qw=words(query); if(!qw.length) return '';
  const groups=new Map();
  const add=(name, qty, loc)=>{
    const nw=words(name); if(!qw.every(w=>nw.some(x=>x.includes(w)))) return;
    const key=nw.join(' '); if(!groups.has(key)) groups.set(key,{name, locs:[]});
    groups.get(key).locs.push(Object.assign({qty}, loc));
  };
  if (!onlyWarehouses) S.vehicles.forEach(v=>(v.inventory||[]).forEach(it=>add(it.name, it.qty, {kind:'v', id:v.id, where:v.name||'آلية'})));
  S.warehouses.forEach(w=>(w.items||[]).forEach(it=>add(it.name, it.qty, {kind:'w', id:w.id, where:w.name||'مستودع'})));
  S.warehouses.forEach(w=>(w.custody||[]).forEach(it=>add(it.name, it.qty, {kind:'w', id:w.id, where:(w.name||'مستودع')+' — عهدة منزلة'})));
  if (!groups.size) return '';
  const list=[...groups.values()].sort((a,b)=>a.name.localeCompare(b.name,'ar',{numeric:true})).slice(0,30);
  const nf=new Intl.NumberFormat('ar-SA');

function hkey(s){
  if (!s) return 0;
  const t=String(s).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c));
  const n=(t.match(/\d+/g)||[]).map(Number); const yi=n.findIndex(x=>x>1300&&x<1600); if (yi<0) return 0;
  const y=n[yi], rest=n.filter((_,i)=>i!==yi); let m=0, d=0;
  const mi=HM.findIndex(a=>a.some(nm=>t.includes(nm)));

}

/* ---------- محرّر المحاضر: يفتح المحضر بشكله الأصلي (صورة الصفحة) وفوقه خانات قابلة للكتابة، ثم يُطبع على A4 بنفس الشكل ---------- */
function minOpen(id, blank){
  const p=getForm(id); if(!p||!p.tpl) return;
  minClose(true);
  const T=p.tpl, W=T.w||1240, H=T.h||1754, pc=(v,b)=>(v/b*100).toFixed(3)+'%';
  const fs=h=>(Math.min(0.68*Math.max(h,28), 0.95*h)/W*100).toFixed(3)+'cqw';
  const order=(a,b)=>((a.p||0)-(b.p||0)) || (Math.round(a.y/18)-Math.round(b.y/18)) || (b.x+b.w-a.x-a.w); // ترتيب القراءة من اليمين للتنقل بزر Tab
  const field=f=>{ const st=`left:${pc(f.x,W)};top:${pc(f.y,H)};width:${pc(f.w,W)};height:${pc(f.h,H)}`;
    return f.t==='c' ? `<button type="button" class="mck" style="${st}" aria-pressed="false" aria-label="خانة اختيار"${blank?' disabled':''}></button>`
      : `<div class="mf${f.c?' mc':''}" style="${st};--fs:${fs(f.h)}" data-v="${esc(f.v||'')}" data-ph="${esc(f.ph||'')}"${blank?'':' contenteditable="true"'} spellcheck="false" dir="auto">${esc(f.v||'')}</div>`; };
  const el=document.createElement('div'); el.id='medit'; el.className='medit'+(blank?' mblank':''); el.dir='rtl';
  el.innerHTML=`<div class="mbar"><b class="mtitle">${esc(p.title||'محضر')}</b><span class="mhint">${blank?'نسخة فارغة جاهزة للطباعة':'اضغط على أي خانة واكتب فيها، ثم اضغط «طباعة»'}</span><span class="grow"></span>
    ${blank?'':`<button type="button" class="btn" data-m="free" aria-pressed="false" title="اضغط الزر ثم اضغط على أي مكان في المحضر لإضافة نص فيه">${ICON.plus}نص في أي مكان</button><button type="button" class="btn" data-m="clear">مسح الخانات</button>`}
    <button type="button" class="btn primary" data-m="print">طباعة</button><button type="button" class="btn" data-m="close">إغلاق</button></div>
    <div class="mpages">${(T.pages||[]).map((b,pi)=>`<div class="mpage" data-p="${pi}"><img src="${esc(blob(b))}" alt="" draggable="false">${(T.fields||[]).filter(f=>(f.p||0)===pi).sort(order).map(field).join('')}</div>`).join('')}</div>`;
  document.body.appendChild(el); document.body.classList.add('medit-on');
  const fit=d=>{ d.style.setProperty('--k',1); let k=1; while(d.scrollWidth>d.clientWidth+1 && k>0.45){ k-=0.05; d.style.setProperty('--k',k.toFixed(2)); } };
  el.querySelectorAll('.mf').forEach(fit);
  const dirty=()=>[...el.querySelectorAll('.mf')].some(d=>d.textContent!==(d.dataset.v||'')) || !!el.querySelector('.mck[aria-pressed=true]');
  el.addEventListener('input', e=>{ const d=e.target.closest('.mf'); if(d) fit(d); });
  el.addEventListener('keydown', e=>{ if(e.target.closest('.mf') && e.key==='Enter'){ e.preventDefault(); e.target.blur(); } });
  el.addEventListener('paste', e=>{ const d=e.target.closest('.mf'); if(!d) return; e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData.getData('text/plain')||'').replace(/\s+/g,' ')); });
  el.addEventListener('focusout', e=>{ const d=e.target.closest('.mf.mfree'); if(d && !d.textContent.trim()) d.remove(); });
  el.addEventListener('click', e=>{
    const ck=e.target.closest('.mck'); if(ck){ if(!blank) ck.setAttribute('aria-pressed', ck.getAttribute('aria-pressed')==='true'?'false':'true'); return; }
    const b=e.target.closest('[data-m]');
    if(b){ const m=b.dataset.m;
      if(m==='close'){ if(!dirty() || confirm('ستُفقد البيانات التي كتبتها في المحضر. إغلاق؟')) minClose(); }
      else if(m==='print') minPrint();
      else if(m==='clear'){ el.querySelectorAll('.mf').forEach(d=>{ if(d.classList.contains('mfree')) d.remove(); else { d.textContent=d.dataset.v||''; fit(d); } }); el.querySelectorAll('.mck').forEach(c=>c.setAttribute('aria-pressed','false')); }
      else if(m==='free'){ const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed', on); el.classList.toggle('free', on); }
      return; }
    const pg=e.target.closest('.mpage');
    if(pg && el.classList.contains('free') && !e.target.closest('.mf')){
      const r=pg.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height, h=36;

/* ---------- human staff (الكادر البشري) ---------- */
const HST = {present:'موجود', absent:'غياب', lateP:'تأخير بإذن', lateN:'تأخير بدون إذن', leave:'إجازة', permit:'رخصة', support:'دعم وردية', proxy:'وكالة', course:'دورة', assign:'تكليف', attach:'إلحاق'};

const hStOf = p => HST[p.status] ? p.status : 'present';
const dayKey = n => { try { return HFN ? hkey(HFN.format(new Date(Date.now()+n*864e5))) : 0; } catch(e){ return 0; } };
const dayStr = n => { try { return HFN ? HFN.format(new Date(Date.now()+n*864e5)).replace(/[\u200f\s]/g,'').replace(/هـ?$/,'')+'هـ' : ''; } catch(e){ return ''; } };
function effSt(p, dk){ const s=hStOf(p); if (s==='present' || !dk) return s; const f=p.from?hkey(p.from):0, t=p.to?hkey(p.to):0;
  if (f && dk<f) return 'present'; if (t && dk>t) return 'present'; return s; }
const effNow = p => effSt(p, dayKey(0));
const subName = p => { const q=p.sub&&getP(p.sub); return q?pLabel(q):(p.subN||''); };
const hPill = p => { const e=effNow(p), s=hStOf(p);
  const tag = s!=='present' && e==='present' ? (p.to && dayKey(0)>hkey(p.to) ? `<span class="hstag end">انتهت ${esc(HST[s])}</span>` : `<span class="hstag soon">تبدأ ${esc(HST[s])} ${esc(p.from||'')}</span>`) : '';
  const lbl = e==='support' ? `دعم: ${SHN[String(p.shift||'1')].replace('الوردية ','')} ← ${SHN[String(p.toShift||'')]?SHN[String(p.toShift)].replace('الوردية ',''):'؟'}` : HST[e];
  return `<span class="stpill ${HCLS[e]}"><i aria-hidden="true"></i>${lbl}</span>${tag}`; };
// members actually on duty in shift k on day dk (own members present + supporters coming in)
const shiftPres = (k, dk) => (S.staff||[]).filter(p=>{ const e=effSt(p,dk), own=String(p.shift||'1')===k; return (own && (e==='present'||e==='proxy')) || (e==='support' && String(p.toShift||'')===k); }).length;
const shiftSupIn = (k, dk) => (S.staff||[]).filter(p=>effSt(p,dk)==='support' && String(p.toShift||'')===k).length;
function staffAlerts(){
  const out=[], st=S.staff||[], cfg=hCfg(), d0=dayKey(0); if (!d0) return out;
  const pl = p => (p.rank?p.rank+' / ':'')+(p.name||'فرد');
  st.forEach(p=>{ const s=hStOf(p); if (s==='present') return;
    const f=p.from?hkey(p.from):0, t=p.to?hkey(p.to):0;
    if (t && d0>t) out.push({lvl:'end', id:p.id, text:`انتهت ${HST[s]} ${pl(p)} بتاريخ ${p.to} — احتُسب «موجود» في النسبة.`});
    else if (f && f>=d0){ let n=-1; for (let i=0;i<=7;i++){ if (dayKey(i)===f){ n=i; break; } }
      if (n>=0) out.push({lvl:'soon', id:p.id, text:`${n===0?'تبدأ اليوم':n===1?'تبدأ غداً':'تبدأ بعد '+arD(n)+' أيام'} ${HST[s]} ${pl(p)} (${p.from}${p.to?' إلى '+p.to:''}).`}); }
    else if (t && t>=d0 && t===dayKey(1)) out.push({lvl:'info', id:p.id, text:`تنتهي ${HST[s]} ${pl(p)} غداً (${p.to}).`});
  });
  // النقص يُحسب على أيام مناوبة كل وردية فقط (التناوب ١ ← ٢ ← ٣، من ٩ ص إلى ٩ ص)، مع احتساب الدعم القادم من الورديات الأخرى.
  // يظهر التنبيه قبل مناوبة الوردية بيوم، ويبقى طوال مناوبتها.
  const dd=dutyDay(), off=(Date.now()+DUTY_TZ_MS)/864e5 - Math.floor((Date.now()+DUTY_TZ_MS)/864e5) < DUTY_H/24 ? -1 : 0;
  ['1','2','3'].forEach(k=>{ const size=cfg.shifts[k]; if (!size) return;
    const duties=[]; for (let j=0;j<=1;j++) if (dutyShift(dd+j)===k) duties.push(j);
    const at = j => { const dk=dayKey(off+j); return {j, pres:shiftPres(k,dk), sup:(S.staff||[]).filter(p=>effSt(p,dk)==='support' && String(p.toShift||'')===k)}; };
    const when = j => j===0 ? 'في مناوبتها الحالية' : off<0 ? `في مناوبتها اليوم (تستلم ٩:٠٠ ص ${dutyDateStr(dd+j)})` : `غداً في مناوبتها يوم ${dutyDateStr(dd+j)} (${dayStr(off+j)})`;
    const short = duties.map(at).find(x=>size-x.pres>3);
    if (short) out.push({lvl:'shift', text:`${SHN[k]}: ${when(short.j)} ${short.j===0?'قوتها':'ستكون قوتها'} ${arD(short.pres)} من ${arD(size)}${short.sup.length?` بعد احتساب ${arD(short.sup.length)} دعم`:''} (نقص ${arD(size-short.pres)} أفراد — أكثر من ٣).`});

    if (next && next.sup.length) out.push({lvl:'info', text:`يصل دعم إلى ${SHN[k]} ${when(next.j)}: ${next.sup.map(p=>pl(p)+' (من '+SHN[String(p.shift||'1')]+')').join('، ')} — قوتها ${arD(next.pres)} من ${arD(size)}.`}); });
  return out;
}

document.addEventListener('change', async e => {
  const el=e.target, key=el.dataset && el.dataset.up; if (!key) return;
  const id=el.dataset.id, files=[...el.files]; el.value=''; if (!files.length) return;
  toast(files.length>1 ? 'جارٍ رفع '+files.length+' ملفات…' : 'جارٍ رفع الملف…');
  try {
    if (key==='form'){
      const f=files[0], ext=(f.name.split('.').pop()||'').toLowerCase();
      if (ext==='doc') throw {code:'olddoc'};
      if (ext==='docx'){
        if (f.size > DOCX_MAX) throw {code:'docbig'};
        const b64=await toB64(f), ref='form-'+id, now=Date.now();
        await S.db.doc('files/'+ref).set({name:f.name, mime:DOCX_MIME, b64, size:f.size, at:now});
        await saveV(id,{form:{db:ref, name:f.name, at:now}});
      } else {
        const fid=await upload(f); await saveV(id,{form:{file:fid, name:f.name, at:Date.now()}});
      }
      toast('رُفع النموذج');
    } else if (key==='invDoc'){
      const old=(getV(id).invDoc||{}).file;
      const fid=await upload(files[0]); await saveV(id,{invDoc:{file:fid, name:files[0].name, at:Date.now()}});
      if (old && S.assets) S.assets.delete(old).catch(()=>{});
      toast('رُفع الجرد الأصلي');
    } else {
      const ids=[]; for (const f of files) ids.push(await upload(f));
      await ownSave(id,{[key]:(ownGet(id)[key]||[]).concat(ids)}); toast(ids.length>1?'أُضيفت الصور':'أُضيفت الصورة');
    }
  } catch(x){ toast(errMsg(x)); }
});

const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
(async () => {
  const [db, user, assets, downloads] = await Promise.all([use('db'), use('user'), use('assets'), use('downloads')]);
  S.db=db; S.user=user; S.assets=assets; S.downloads=downloads;
  if (user){ try { S.me=await user.me(); S.canEdit=!!S.me.canEdit; } catch(e){} }
  renderWho();
  if (!db){ S.dbFailed=true; render(); return; }
  const fail = () => { S.dbFailed=true; render(); };
  db.collection('vehicles').onSnapshot(s => { S.vehicles=s.docs.map(d=>Object.assign({id:d.id}, d.data())); S.loadedV=true; render(); }, fail);
  db.collection('faults').onSnapshot(s => { S.faults=s.docs.map(d=>Object.assign({id:d.id}, d.data())); S.loadedF=true; render(); }, fail);
  db.collection('tasks').onSnapshot(s => { S.tasks=s.docs.map(d=>Object.assign({id:d.id}, d.data())); S.loadedTk=true; render(); }, fail);
  for (const key of Object.keys(LIBS)) db.collection(key).onSnapshot(s => { S.lib[key].items=s.docs.map(d=>Object.assign({id:d.id}, d.data())); S.lib[key].loaded=true; render(); }, fail);
  db.collection('warehouses').onSnapshot(s => { S.warehouses=s.docs.map(d=>Object.assign({id:d.id}, d.data())); S.loadedW=true; render(); }, fail);
  for (const c of ['staff','absences','rewards','missions']) db.collection(c).onSnapshot(s => { S[c]=s.docs.map(d=>Object.assign({id:d.id}, d.data())); S.hl[c]=1; S.loadedH=Object.keys(S.hl).length>=4; render(); }, fail);
  db.collection('equipment').onSnapshot(s => { S.equip=s.docs.map(d=>Object.assign({id:d.id}, d.data())); S.loadedE=true; render(); }, fail);
  db.collection('consum').onSnapshot(s => { S.consum=s.docs.map(d=>Object.assign({id:d.id}, d.data())); S.loadedC=true; render(); }, fail);
  for (const c of ['letters','ptx']) db.collection(c).onSnapshot(s => { S[c]=s.docs.map(d=>Object.assign({id:d.id}, d.data())); S.tl[c]=1; S.loadedT=Object.keys(S.tl).length>=2; render(); }, fail);
  db.doc('settings/hr').onSnapshot(s => { S.hrs = s.exists ? s.data() : {}; S.hrsLoaded=true; render(); }, () => { S.hrsLoaded=true; render(); });
  db.collection('forms').onSnapshot(s => { S.forms=s.docs.map(d=>Object.assign({id:d.id}, d.data())); S.loadedFm=true; render(); }, fail);
  db.collection('guide').onSnapshot(s => { S.guide=s.docs.map(d=>Object.assign({id:d.id}, d.data())); S.loadedAdv=true; render(); }, () => { S.loadedAdv=true; render(); });
  db.collection('pdocs').onSnapshot(s => { S.pdocs=s.docs.map(d=>Object.assign({id:d.id}, d.data())); render(); }, fail);
  db.collection('incoming').onSnapshot(s => { S.incoming=s.docs.map(d=>Object.assign({id:d.id}, d.data())); render(); }, fail);
  db.collection('sites').onSnapshot(s => { S.sites=s.docs.map(d=>Object.assign({id:d.id}, d.data())); S.loadedSt=true; render(); }, fail);
  db.doc('settings/map').onSnapshot(s => { S.map = s.exists ? s.data() : {}; S.mapLoaded=true; render(); }, () => { S.mapLoaded=true; render(); });
  db.doc('settings/misdocs').onSnapshot(s => { S.misd = s.exists ? s.data() : {}; render(); }, () => {});
  db.doc('settings/site').onSnapshot(s => { S.settings = s.exists ? s.data() : {}; renderBrand(); }, () => {});
  render();
})();
