<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة مدير الإدارة العامة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --brand:#0E3D2C; --bg:#E8EEEB; --surface:#FFFFFF; --surface-2:#F7F9F8; --line:#5E8F79;--edge:#1F5A43;
  --text:#0B1612; --muted:#2C3A33; --faint:#4A5852;
  --accent:#1F7A56; --accent-hover:#17694A; --on-accent:#FFFFFF; --accent-soft:#E4F1EA;
  --ok:#1F7A56; --ok-bg:#E4F1EA; --mid:#B54708; --mid-bg:#FEF0C7; --bad:#B42318; --bad-bg:#FDECEA;
  --away:#3E5BA9; --away-bg:#E8EDFB; --none:#98A2B3; --none-bg:#F2F4F7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --brand:#0A2A1F; --bg:#0F1513; --surface:#151D1A; --surface-2:#19231F; --line:#33463E;--edge:#3E7A62;
    --text:#E6ECE9; --muted:#A3B0AA; --faint:#7F8C86;
    --accent:#45A980; --accent-hover:#5BBB93; --on-accent:#05130D; --accent-soft:#16352A;
    --ok:#45A980; --ok-bg:#16352A; --mid:#F5B544; --mid-bg:#3A2A0C; --bad:#F97066; --bad-bg:#3A1714;
    --away:#8EA6F0; --away-bg:#1C2544; --none:#7F8C86; --none-bg:#1E2724;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --brand:#0A2A1F; --bg:#0F1513; --surface:#151D1A; --surface-2:#19231F; --line:#33463E;--edge:#3E7A62;
  --text:#E6ECE9; --muted:#A3B0AA; --faint:#7F8C86;
  --accent:#45A980; --accent-hover:#5BBB93; --on-accent:#05130D; --accent-soft:#16352A;
  --ok:#45A980; --ok-bg:#16352A; --mid:#F5B544; --mid-bg:#3A2A0C; --bad:#F97066; --bad-bg:#3A1714;
  --away:#8EA6F0; --away-bg:#1C2544; --none:#7F8C86; --none-bg:#1E2724;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:'Tajawal',"Segoe UI",Tahoma,system-ui,sans-serif;color:var(--text);line-height:1.55;font-size:15px}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
bdi{unicode-bidi:isolate}
.band{background:#B42318;color:#fff;text-align:center;font-size:13px;font-weight:800;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px))}

/* بوابة الدخول */
.gate{min-height:calc(100vh - 36px);display:flex;align-items:center;justify-content:center;padding:32px 16px;background:var(--brand)}
.gcard{width:100%;max-width:420px;background:var(--surface);border-radius:20px;box-shadow:0 30px 60px rgba(0,0,0,.35);padding:36px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.logo{width:84px;height:84px;border-radius:50%;background:#fff;border:1px solid #E6ECE9;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px}
.logo img{width:72px;height:72px;object-fit:contain}
.gcard h1{margin:0;font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:14px}
.fld{width:100%;margin-top:20px;text-align:start}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.fld input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-size:15px;outline:none}
.fld input:focus{border-color:var(--accent)}
.err{margin-top:8px;color:var(--bad);font-size:13.5px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;min-height:40px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);color:var(--on-accent)}
.btn.wide{width:100%;margin-top:14px;min-height:48px;font-size:16px}
.back{margin-top:14px;font-size:13px;font-weight:700;color:var(--accent);text-decoration:none}

/* اللوحة */
.top{background:var(--brand);color:#fff;padding:18px 16px 60px}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .logo{width:56px;height:56px;margin:0;flex-shrink:0}
.top .logo img{width:48px;height:48px}
.top h1{margin:0;font-size:24px;font-weight:800}
.top .meta{font-size:13.5px;opacity:.85;display:flex;flex-wrap:wrap;gap:4px 14px}
.top .meta b{font-weight:800}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-inline-start:auto}
.acts .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
.acts .btn:hover{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.4)}
main{max-width:1240px;margin:-44px auto 0;padding:0 16px 48px;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}
.sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.sh h2{margin:0;font-size:18px;font-weight:800}
.sh .cnt{font-size:13px;font-weight:800;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--muted)}
.sh .grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .kt{font-size:13px;font-weight:700;color:var(--muted)}
.kpi .kv{font-size:28px;font-weight:800;line-height:1.2}
.kpi .kv small{font-size:14px;font-weight:700;color:var(--muted)}
.kpi .kd{font-size:12.5px;color:var(--muted)}
.kpi.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.kpi.main .kt,.kpi.main .kd{color:inherit;opacity:.85}
.c-ok{color:var(--ok)}.c-mid{color:var(--mid)}.c-bad{color:var(--bad)}.c-away{color:var(--away)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ucard{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s,transform .15s}
.ucard.lv-bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.ucard.lv-none{opacity:.72}
.uhead{display:flex;align-items:center;gap:8px}
.uhead b{font-size:16px;font-weight:800;flex:1;min-width:0}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor}
.lv-ok .badge,.badge.lv-ok{background:var(--ok-bg);color:var(--ok)}
.lv-mid .badge,.badge.lv-mid{background:var(--mid-bg);color:var(--mid)}
.lv-bad .badge,.badge.lv-bad{background:var(--bad-bg);color:var(--bad)}
.lv-none .badge,.badge.lv-none{background:var(--none-bg);color:var(--none)}
.upct{display:flex;align-items:baseline;gap:8px}
.upct strong{font-size:30px;font-weight:800;line-height:1}
.bar{display:flex;height:9px;border-radius:999px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%}
.st-ready{background:var(--ok)}.st-down{background:var(--bad)}.st-maint{background:var(--mid)}.st-away{background:var(--away)}.st-none{background:var(--none)}
.ustats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px;margin:0}
.ustats div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.ustats dt{color:var(--muted)}
.ustats dd{margin:0;font-weight:800}
.uempty{font-size:13px;color:var(--muted);padding:6px 0}
.ugo{margin-top:auto;font-size:13px;font-weight:700;color:var(--accent)}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:800;background:var(--surface-2);white-space:nowrap}
td.n{font-weight:800;white-space:nowrap}
tr.tot td{font-weight:800;background:var(--surface-2)}
.minibar{display:inline-block;width:70px;height:7px;border-radius:999px;background:var(--line);overflow:hidden;vertical-align:middle;margin-inline-start:6px}
.minibar i{display:block;height:100%}

.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grp{margin-bottom:14px}
.grp:last-child{margin-bottom:0}
.grp h3{font-size:14.5px;font-weight:800;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.code{font-weight:800;min-width:52px;color:var(--muted)}
.row .grow{flex:1;min-width:0}
.row small{display:block;color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.p-down{background:var(--bad-bg);color:var(--bad)}.p-maint{background:var(--mid-bg);color:var(--mid)}.p-away{background:var(--away-bg);color:var(--away)}.p-none{background:var(--none-bg);color:var(--none)}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:14px}
.alerts li.a-bad{background:var(--bad-bg);border-color:transparent}
.alerts li.a-mid{background:var(--mid-bg);border-color:transparent}
.alerts .ic{font-weight:800;flex-shrink:0}
.none{color:var(--muted);font-size:14px;padding:6px 0}
.loading{padding:40px;text-align:center;color:var(--muted)}
.foot{font-size:12.5px;color:var(--faint);text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14201B;color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px;z-index:9}
@media (max-width:900px){.two{grid-template-columns:1fr}}
@media (max-width:560px){
  .top h1{font-size:20px}
  .acts{margin-inline-start:0;width:100%}
  .acts .btn{flex:1 1 auto;padding:8px 10px;font-size:13px}
  .kpi .kv{font-size:24px}
  .panel{padding:14px}
}
@media print{
  .band,.acts,.chips,.noprint,.toast{display:none!important}
  body,html{background:#fff}
  .top{background:#fff;color:#000;padding:0 0 10px}
  main{margin:0;padding:0}
  .panel,.kpi,.ucard{box-shadow:none;break-inside:avoid}
  .kpi.main{background:#fff;color:#000;border-color:#999}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* أطراف واضحة باللون الأخضر الغامق (تبقى ظاهرة على الشاشات الفاتحة) */
.panel,.kpi,.ucard{border:2px solid var(--edge)!important}

/* التعاميم */
.cform{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.cform .full{grid-column:1/-1}
.cform label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.cform input,.cform textarea{font:inherit;font-weight:400;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--text)}
.cform textarea{min-height:80px;resize:vertical}
.clist{display:flex;flex-direction:column}
.crow{display:flex;gap:14px;align-items:flex-start;padding:14px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crow:last-child{border-bottom:0}
.crow .ct{flex:1 1 280px;min-width:0}
.crow b{font-size:15.5px}.crow small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.crow p{margin:6px 0 0;font-size:14px;white-space:pre-wrap}
.cerr{color:var(--bad);font-weight:700;font-size:13.5px}
@media (max-width:640px){ .cform{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="band">سرّي — محظور التداول — مقصور استخدامه على منسوبي الدفاع المدني</div>

<section class="gate" id="gate" hidden>
  <form class="gcard" id="gform">
    <div class="logo" data-logo></div>
    <h1>لوحة مدير الإدارة العامة</h1>
    <div class="sub">جاهزية المراكز والأقسام في صفحة واحدة</div>
    <div class="fld" id="usrf" hidden>
      <label for="usr">اسم المستخدم</label>
      <input id="usr" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" dir="ltr" placeholder="اسم المستخدم">
    </div>
    <div class="fld">
      <label for="pw">كلمة المرور</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="أدخل كلمة مرور لوحة المدير">
    </div>
    <div class="fld" id="reff" hidden>
      <label for="ref">رمز المرجع</label>
      <input id="ref" type="password" inputmode="numeric" autocomplete="off" dir="ltr" placeholder="رمز المرجع">
    </div>
    <div class="fld"><div class="err" id="perr" role="alert" hidden></div></div>
    <button type="submit" class="btn primary wide" id="pgo">دخول</button>
    <a class="back" href="index.html">→ الرجوع للقائمة الرئيسية</a>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="logo" data-logo></div>
      <div>
        <h1>لوحة مدير الإدارة العامة</h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="acts">
        <button type="button" class="btn" data-act="circ" id="circBtn">التعاميم</button>
        <button type="button" class="btn" data-act="qst" id="qstBtn">إحصائية المراكز والأقسام</button>
        <button type="button" class="btn" data-act="refresh">تحديث</button>
        <button type="button" class="btn" data-act="copySum">نسخ الملخص</button>
        <button type="button" class="btn" data-act="print">طباعة التقرير</button>
        <a class="btn" href="index.html">القائمة الرئيسية</a>
        <button type="button" class="btn" data-act="logout">خروج</button>
      </div>
    </div>
  </header>
  <main id="main"><div class="panel loading">جارٍ جمع بيانات الجهات…</div></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>/*CONFIG*/</script>
<script>
(function () {
  const cfg = window.ISNAD_CONFIG || {};
  // نفس اللوحة تُنشر باسم «لوحة مدير إدارة العمليات» (ops.html) بنفس الرمز والمميزات
  if (cfg.title) { document.title = cfg.title; document.querySelectorAll('h1').forEach((h) => { if (h.textContent.trim() === 'لوحة مدير الإدارة العامة') h.textContent = cfg.title; }); }
  const $ = (s) => document.getElementById(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ss = {
    get: (k) => { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} },
    del: (k) => { try { sessionStorage.removeItem(k); } catch (e) {} },
  };
  const ls = {
    get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const AUTH = 'isnad-auth-manager';
  const shield = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0E3D2C" stroke-width="2" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V5l-8-3Z"/></svg>';
  document.querySelectorAll('[data-logo]').forEach((el) => (el.innerHTML = cfg.logo ? `<img src="${esc(cfg.logo)}" alt="شعار الدفاع المدني">` : shield));
  let tt;
  const toast = (m) => { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2600); };

  /* ---------- نفس حسابات صفحة الجهة (page.html) ---------- */
  const arD = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
  const pctFmt = (n) => new Intl.NumberFormat('ar-SA', { style: 'percent', maximumFractionDigits: 0 }).format(n);
  const HF = (() => { try { return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return null; } })();
  const HFN = (() => { try { return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { day: 'numeric', month: 'numeric', year: 'numeric' }); } catch (e) { return null; } })();
  const HM = [['محرم'],['صفر'],['ربيع الأول','ربيع الاول'],['ربيع الآخر','ربيع الثاني','ربيع الاخر'],['جمادى الأولى','جمادى الاولى','جمادى الأول'],['جمادى الآخرة','جمادى الثانية','جمادى الاخرة'],['رجب'],['شعبان'],['رمضان'],['شوال'],['ذو القعدة','ذي القعدة'],['ذو الحجة','ذي الحجة']];
  function hkey(s) {
    if (!s) return 0;
    const t = String(s).replace(/[٠-٩]/g, (c) => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g, (c) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(c));
    const n = (t.match(/\d+/g) || []).map(Number); const yi = n.findIndex((x) => x > 1300 && x < 1600); if (yi < 0) return 0;
    const y = n[yi], rest = n.filter((_, i) => i !== yi); let m = 0, d = 0;
    const mi = HM.findIndex((a) => a.some((nm) => t.includes(nm)));
    if (mi >= 0) { m = mi + 1; d = rest[0] || 0; } else if (yi === 0) { m = rest[0] || 0; d = rest[1] || 0; } else { d = rest[0] || 0; m = rest[1] || 0; }
    return y * 10000 + Math.min(m, 12) * 100 + Math.min(d, 31);
  }
  const dayKey = (n) => { try { return HFN ? hkey(HFN.format(new Date(Date.now() + n * 864e5))) : 0; } catch (e) { return 0; } };
  const STATUS = { ready: 'جاهزة', down: 'متعطلة بالمقر', maint: 'في الصيانة', away: 'مدعومة لجهة أخرى', none: 'غير محددة' };
  const stOf = (v) => (STATUS[v.status] && v.status !== 'none' ? v.status : 'none');
  const ENJ = ['','البلد','شراف','المنتزه','الصناعية','العزيزية','الدائري','أجا','الجبل','التدخل','الخطة'];
  const enj = (t) => String(t || '').replace(/(إنجاز|انجاز)\s*([0-9٠-٩]+)(?![0-9٠-٩]|\s*\()/g, (m, a, n) => { const k = +String(n).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)); return ENJ[k] && !String(t).includes(ENJ[k]) ? `${m} (${ENJ[k]})` : m; });
  const HST = { present: 'موجود', absent: 'غياب', lateP: 'تأخير بإذن', lateN: 'تأخير بدون إذن', leave: 'إجازة', permit: 'رخصة', support: 'دعم وردية', proxy: 'وكالة', course: 'دورة', assign: 'تكليف', attach: 'إلحاق', mission: 'مهمة' };
  const hStOf = (p) => (HST[p.status] ? p.status : 'present');
  function effSt(p, dk) { const s = hStOf(p); if (s === 'present' || !dk) return s; const f = p.from ? hkey(p.from) : 0, t = p.to ? hkey(p.to) : 0; if (f && dk < f) return 'present'; if (t && dk > t) return 'present'; return s; }
  const shiftPres = (staff, k, dk) => staff.filter((p) => { const e = effSt(p, dk), own = String(p.shift || '1') === k; return (own && (e === 'present' || e === 'proxy' || e === 'lateP' || e === 'lateN')) || (e === 'support' && String(p.toShift || '') === k); }).length;
  function hCfg(h) { h = h || {}; const s = h.shifts || {}, n = (v, d) => (v != null && v !== '' && !isNaN(+v) ? +v : d); return { strength: n(h.strength, 17), shifts: { 1: n(s['1'], 6), 2: n(s['2'], 6), 3: n(s['3'], 5), 4: n(s['4'], 0), 5: n(s['5'], 0), 6: n(s['6'], 0) }, ctAnchor: h.ctAnchor != null && h.ctAnchor !== '' && !isNaN(+h.ctAnchor) ? +h.ctAnchor : null }; }
  // مركز التحكم والتوجيه: ٦ ورديات × ٨ ساعات، المجموعتان تتناوبان كل يومين (ctAnchor = يوم بداية المجموعة الأولى)
  const ctNow = (hc, t = Date.now()) => { if (hc.ctAnchor == null) return null; const d = Math.floor((t + 3 * 36e5 - 8 * 36e5) / 864e5), g = ((((d - hc.ctAnchor) % 4) + 4) % 4) < 2 ? 1 : 2, h = new Date(t + 3 * 36e5).getUTCHours(), i = h >= 8 && h < 16 ? 0 : h >= 16 ? 1 : 2; return String((g - 1) * 3 + i + 1); };
  const SHN = { 1: 'الوردية الأولى', 2: 'الوردية الثانية', 3: 'الوردية الثالثة' };
  const DUTY_H = 9, DUTY_TZ_MS = 3 * 36e5, DUTY_ANCHOR = Date.UTC(2026, 8, 29) / 864e5, DUTY_ANCHOR_SHIFT = 3;
  const dutyDay = (t = Date.now()) => Math.floor((t + DUTY_TZ_MS - DUTY_H * 36e5) / 864e5);
  const dutyShift = (d = dutyDay()) => String((((DUTY_ANCHOR_SHIFT - 1 + d - DUTY_ANCHOR) % 3) + 3) % 3 + 1);
  const dutyOff = () => ((Date.now() + DUTY_TZ_MS) / 864e5 - Math.floor((Date.now() + DUTY_TZ_MS) / 864e5) < DUTY_H / 24 ? -1 : 0);
  const fOpen = (f) => f.status !== 'done';
  const eqOut = (r) => r.dir === 'out' && !r.returned;
  const isWater = (v) => /وايت/.test(v.name || '');
  const isProp = (v) => isWater(v) && /بروبلين/.test(v.name || '');
  const vLabel = (v) => (v.code ? v.code + ' — ' : '') + (v.name || 'آلية');

  /* ---------- تحليل كل جهة ---------- */
  function analyze(u, d) {
    const C = (d && d.collections) || {};
    const arr = (k) => Object.entries(C[k] || {}).map(([id, x]) => Object.assign({ id }, x));
    // مهام الجهات داخلية لكل جهة ولا تُقرأ هنا
    const V = arr('vehicles'), staff = arr('staff'), faults = arr('faults'), equip = arr('equipment');
    const c = { ready: 0, down: 0, maint: 0, away: 0, none: 0 };
    V.forEach((v) => c[stOf(v)]++);
    const rated = c.ready + c.down + c.maint, pct = rated ? c.ready / rated : null;
    // الوايتات الواردة دعماً من الإسناد تُحسب جاهزة لدى المركز (مع وسمها بأنها دعم)
    const incW = arr('incoming').filter(isWater).map((v) => ({ ...v, status: 'ready', sup: true }));
    const W = V.filter(isWater).concat(incW), P = W.filter(isProp), A = W.filter((v) => !isProp(v));
    const rd = (L) => L.filter((v) => stOf(v) === 'ready');
    const hc = hCfg(((C.settings || {}).hr) || {}), off = dutyOff(), dd = dutyDay();
    const k = u.id === 'control' ? ctNow(hc) : dutyShift(dd);
    const size = k ? hc.shifts[k] || 0 : 0, pres = k ? shiftPres(staff, k, dayKey(u.id === 'control' ? 0 : off)) : 0;
    const empty = !V.length && !staff.length;
    // الحالة تُحسب على جاهزية الآليات فقط (بلا تنبيهات عن الكادر)
    const lv = empty ? 'none' : pct != null && pct < 0.5 ? 'bad' : pct != null && pct < 0.8 ? 'mid' : 'ok';
    return {
      u, ok: !!d, empty, lv, V, c, rated, pct,
      water: { all: [rd(W), W], prop: [rd(P), P], aydi: [rd(A), A] }, waterSup: incW.length,
      staffN: staff.length, size, pres,
      faults: faults.filter(fOpen), eqOut: equip.filter(eqOut),
      notReady: V.filter((v) => ['down', 'maint'].includes(stOf(v))).sort((a, b) => (stOf(a) === 'down' ? 0 : 1) - (stOf(b) === 'down' ? 0 : 1)),
      away: V.filter((v) => stOf(v) === 'away'),
      qst: arr('consum').filter((r) => r.qstat), mov: arr('consum').filter((r) => !r.qstat),
      center: u.id !== 'isnad', inc: arr('incoming'), // المراكز تستقبل «دعم وارد» ولا تدعم غيرها
    };
  }

  /* ---------- جلب البيانات ---------- */
  let R = [], loadedAt = 0, busy = false;
  const S = { sort: ls.get('isnad-mgr-sort') || 'order', show: ls.get('isnad-mgr-show') || 'all' };
  async function load() {
    if (busy) return; busy = true;
    try {
      const res = await Promise.all((cfg.units || []).map(async (u) => {
        try {
          const r = await fetch((u.web || '') + 'db.json', { cache: 'no-store' });
          if (r.status === 401) throw Object.assign(new Error('401'), { auth: true });
          return analyze(u, r.ok ? await r.json() : null);
        } catch (e) { if (e.auth) throw e; return analyze(u, null); }
      }));
      R = res; loadedAt = Date.now(); render();
    } catch (e) {
      if (e.auth) { ss.del(AUTH); showGate(); }
    } finally { busy = false; }
  }

  /* ---------- العرض ---------- */
  const LV = { ok: 'جاهز', mid: 'يحتاج متابعة', bad: 'حرج', none: 'لا توجد بيانات بعد' };
  const PILL = { down: 'p-down', maint: 'p-maint', away: 'p-away', none: 'p-none' };
  const pct0 = (x) => (x.pct == null ? '—' : pctFmt(x.pct));
  const lvColor = (x) => (x.pct == null ? '' : x.pct >= 0.8 ? 'c-ok' : x.pct >= 0.5 ? 'c-mid' : 'c-bad');
  const bar = (c) => { const t = c.ready + c.down + c.maint + c.away + c.none; const w = (n) => (t ? ((n / t) * 100).toFixed(2) : 0) + '%'; return `<div class="bar" role="img" aria-label="جاهزة ${c.ready}، متعطلة ${c.down}، صيانة ${c.maint}، مدعومة ${c.away}">${['ready', 'down', 'maint', 'away', 'none'].map((s) => `<span class="st-${s}" style="width:${w(c[s])}"></span>`).join('')}</div>`; };
  const shiftTxt = (x) => (x.size ? `${arD(x.pres)} من ${arD(x.size)}` : '—');
  const hijri = () => (HF ? HF.format(new Date()) : new Date().toLocaleDateString('ar'));
  const timeStr = (t) => new Intl.DateTimeFormat('ar-SA', { hour: 'numeric', minute: '2-digit' }).format(new Date(t));

  function card(x) {
    const u = x.u;
    if (x.empty) return `<div class="ucard lv-none"><div class="uhead"><b>${esc(u.name)}</b><span class="badge"><i></i>${LV.none}</span></div><div class="uempty">${x.ok ? 'لم تُدخل آليات أو أفراد في هذه الجهة حتى الآن.' : 'تعذّر تحميل بيانات الجهة.'}</div></div>`;
    const w = x.water.all;
    return `<div class="ucard lv-${x.lv}">
      <div class="uhead"><b>${esc(u.name)}</b><span class="badge"><i></i>${LV[x.lv]}</span></div>
      <div class="upct"><strong class="${lvColor(x)}">${esc(pct0(x))}</strong><span class="muted small">جاهزية الآليات · ${arD(x.c.ready)} من ${arD(x.rated)}</span></div>
      ${bar(x.c)}
      <dl class="ustats">
        <div><dt>متعطلة بالمقر</dt><dd class="${x.c.down ? 'c-bad' : ''}">${arD(x.c.down)}</dd></div>
        <div><dt>في الصيانة</dt><dd class="${x.c.maint ? 'c-mid' : ''}">${arD(x.c.maint)}</dd></div>
        ${x.center ? `<div><dt>دعم وارد</dt><dd class="${x.inc.length ? 'c-away' : ''}">${arD(x.inc.length)}</dd></div>` : `<div><dt>مدعومة لجهات</dt><dd class="${x.c.away ? 'c-away' : ''}">${arD(x.c.away)}</dd></div>`}
        <div><dt>الوايتات الجاهزة</dt><dd>${w[1].length ? `${arD(w[0].length)} من ${arD(w[1].length)}` : '—'}${x.waterSup ? `<small class="c-away" style="display:block;font-weight:600">منها ${arD(x.waterSup)} دعم</small>` : ''}</dd></div>
        <div><dt>قوة الوردية</dt><dd>${shiftTxt(x)}</dd></div>
        <div><dt>الأفراد</dt><dd>${arD(x.staffN)}</dd></div>
        <div><dt>أعطال المبنى</dt><dd class="${x.faults.length ? 'c-mid' : ''}">${arD(x.faults.length)}</dd></div>
        <div><dt>معدات لم ترجع</dt><dd>${arD(x.eqOut.length)}</dd></div>
      </dl>
    </div>`;
  }

  function totals() {
    const t = { c: { ready: 0, down: 0, maint: 0, away: 0, none: 0 }, size: 0, pres: 0, faults: 0, eq: 0, wr: 0, wt: 0, V: 0 };
    R.forEach((x) => { for (const s in t.c) t.c[s] += x.c[s]; if (x.size) { t.size += x.size; t.pres += x.pres; } t.faults += x.faults.length; t.eq += x.eqOut.length; t.wr += x.water.all[0].length; t.wt += x.water.all[1].length - (x.waterSup || 0); /* وايت الدعم مُحصى أصلاً عند الإسناد */ t.V += x.V.length; });
    t.rated = t.c.ready + t.c.down + t.c.maint; t.pct = t.rated ? t.c.ready / t.rated : null;
    return t;
  }

  function alerts() {
    const out = [];
    R.forEach((x) => {
      if (x.empty) return;
      const n = x.u.name;
      if (x.pct != null && x.pct < 0.5) out.push(['bad', '⚠', `${n}: جاهزية الآليات ${pctFmt(x.pct)} فقط.`]);
      const W = x.water.all; if (W[1].length && !W[0].length) out.push(['bad', '⚠', `${n}: لا يوجد وايت جاهز (${arD(W[1].length)} وايت غير جاهز).`]);
    });
    const r = { bad: 0, mid: 1 };
    return out.sort((a, b) => r[a[0]] - r[b[0]]);
  }

  function render() {
    if (S.qv) return qView();
    if (S.circ) return;
    const t = totals(), d = dutyDay(), k = dutyShift(d);
    $('meta').innerHTML = `<span>${esc(hijri())}</span><span>الوردية المناوبة: <b>${SHN[k].replace('الوردية ', '')}</b> (٩ ص ← ٩ ص)</span><span>آخر تحديث: ${esc(timeStr(loadedAt))}</span>`;
    const withData = R.filter((x) => !x.empty);
    let list = S.show === 'data' ? withData : R.slice();
    if (S.sort === 'pct') list.sort((a, b) => (a.empty - b.empty) || ((a.pct ?? 2) - (b.pct ?? 2)));
    if (S.sort === 'lv') { const o = { bad: 0, mid: 1, ok: 2, none: 3 }; list.sort((a, b) => o[a.lv] - o[b.lv]); }
    const chip = (key, v, l) => `<button type="button" class="chip" data-act="${key}" data-v="${v}" aria-pressed="${S[key] === v}">${l}</button>`;
    const lvCount = (l) => R.filter((x) => x.lv === l).length;

    const kpis = `<section class="kpis" aria-label="المؤشرات العامة">
      <div class="kpi main"><span class="kt">الجاهزية الإجمالية للآليات</span><span class="kv">${t.pct == null ? '—' : esc(pctFmt(t.pct))}</span><span class="kd">${arD(t.c.ready)} جاهزة من ${arD(t.rated)} في ${arD(withData.length)} جهات</span></div>
      <div class="kpi"><span class="kt">حالة الجهات</span><span class="kv"><span class="c-ok">${arD(lvCount('ok'))}</span> <small>جاهز</small></span><span class="kd"><span class="c-mid">${arD(lvCount('mid'))} يحتاج متابعة</span> · <span class="c-bad">${arD(lvCount('bad'))} حرج</span></span></div>
      <div class="kpi"><span class="kt">آليات غير جاهزة</span><span class="kv c-bad">${arD(t.c.down + t.c.maint)}</span><span class="kd">متعطلة ${arD(t.c.down)} · صيانة ${arD(t.c.maint)} · مدعومة ${arD(t.c.away)}</span></div>
      <div class="kpi"><span class="kt">الوايتات الجاهزة</span><span class="kv">${arD(t.wr)} <small>من ${arD(t.wt)}</small></span><span class="kd">في كل الجهات</span></div>
      <div class="kpi"><span class="kt">القوة المناوبة الآن</span><span class="kv">${arD(t.pres)} <small>من ${arD(t.size)}</small></span><span class="kd">في الورديات المناوبة</span></div>
      <div class="kpi"><span class="kt">أعطال المباني</span><span class="kv ${t.faults ? 'c-mid' : ''}">${arD(t.faults)} <small>غير منجزة</small></span><span class="kd">معدات عند جهات ولم ترجع: ${arD(t.eq)}</span></div>
    </section>`;

    const cards = `<section class="panel" aria-label="جاهزية المراكز"><div class="sh"><h2>جاهزية المراكز والأقسام</h2><span class="cnt">${arD(R.length)}</span><span class="grow"></span>
      <div class="chips" role="group" aria-label="الترتيب">${chip('sort', 'order', 'الترتيب الأساسي')}${chip('sort', 'lv', 'الأحرج أولًا')}${chip('sort', 'pct', 'الأقل جاهزية')}</div>
      <div class="chips" role="group" aria-label="العرض">${chip('show', 'all', 'كل الجهات')}${chip('show', 'data', 'التي فيها بيانات')}</div></div>
      <div class="cards">${list.map(card).join('') || '<div class="none">لا توجد جهات فيها بيانات بعد.</div>'}</div></section>`;

    const row = (x) => `<tr><td class="n">${esc(x.u.name)}</td><td><span class="badge lv-${x.lv}"><i></i>${LV[x.lv]}</span></td><td class="n ${lvColor(x)}">${esc(pct0(x))}${x.pct != null ? `<span class="minibar"><i class="${x.pct >= 0.8 ? 'st-ready' : x.pct >= 0.5 ? 'st-maint' : 'st-down'}" style="width:${(x.pct * 100).toFixed(0)}%"></i></span>` : ''}</td><td>${arD(x.V.length)}</td><td>${arD(x.c.ready)}</td><td>${arD(x.c.down)}</td><td>${arD(x.c.maint)}</td><td>${x.center ? (x.inc.length ? 'وارد ' + arD(x.inc.length) : '—') : arD(x.c.away)}</td><td>${x.water.all[1].length ? arD(x.water.all[0].length) + ' / ' + arD(x.water.all[1].length) : '—'}</td><td>${arD(x.staffN)}</td><td>${shiftTxt(x)}</td><td>${arD(x.faults.length)}</td></tr>`;
    const table = `<section class="panel" aria-label="جدول المقارنة"><div class="sh"><h2>جدول المقارنة</h2></div><div class="tw"><table>
      <thead><tr><th>الجهة</th><th>الحالة</th><th>الجاهزية</th><th>الآليات</th><th>جاهزة</th><th>متعطلة</th><th>صيانة</th><th>مدعومة / دعم وارد</th><th>الوايتات الجاهزة</th><th>الأفراد</th><th>الوردية الآن</th><th>أعطال مبنى</th></tr></thead>
      <tbody>${list.map(row).join('')}<tr class="tot"><td>الإجمالي</td><td></td><td>${t.pct == null ? '—' : esc(pctFmt(t.pct))}</td><td>${arD(t.V)}</td><td>${arD(t.c.ready)}</td><td>${arD(t.c.down)}</td><td>${arD(t.c.maint)}</td><td>${arD(t.c.away)}</td><td>${arD(t.wr)} / ${arD(t.wt)}</td><td>${arD(R.reduce((s, x) => s + x.staffN, 0))}</td><td>${arD(t.pres)} من ${arD(t.size)}</td><td>${arD(t.faults)}</td></tr></tbody></table></div></section>`;

    const al = alerts();
    const alertsHtml = `<section class="panel" aria-label="تنبيهات"><div class="sh"><h2>تنبيهات الجاهزية</h2><span class="cnt">${arD(al.length)}</span></div>${al.length ? `<ul class="alerts">${al.map(([l, i, s]) => `<li class="a-${l}"><span class="ic">${i}</span><span>${esc(s)}</span></li>`).join('')}</ul>` : '<div class="none">لا توجد تنبيهات — كل الجهات في وضع جيد.</div>'}</section>`;

    const nr = R.filter((x) => x.notReady.length);
    const nrHtml = `<section class="panel" aria-label="الآليات غير الجاهزة"><div class="sh"><h2>الآليات غير الجاهزة</h2><span class="cnt">${arD(t.c.down + t.c.maint)}</span><span class="grow"></span>${nr.length ? '<button type="button" class="btn noprint" data-act="copyDown">نسخ رسالة للصيانة</button>' : ''}</div>
      ${nr.length ? nr.map((x) => `<div class="grp"><h3>${esc(x.u.name)} <span class="cnt">${arD(x.notReady.length)}</span></h3>${x.notReady.map((v) => `<div class="row"><span class="code"><bdi dir="ltr">${esc(v.code || '—')}</bdi></span><span class="grow">${esc(v.name || 'آلية')}${v.statusNote || v.statusAction ? `<small>${esc([v.statusNote ? enj(v.statusNote) : '', v.statusAction].filter(Boolean).join(' — '))}</small>` : ''}</span><span class="pill ${PILL[stOf(v)]}"><i></i>${STATUS[stOf(v)]}</span></div>`).join('')}</div>`).join('') : '<div class="none">كل الآليات جاهزة أو مدعومة.</div>'}</section>`;

    const aw = R.filter((x) => x.away.length);
    const awHtml = `<section class="panel" aria-label="تحركات الدعم"><div class="sh"><h2>تحركات الدعم بين الجهات</h2><span class="cnt">${arD(t.c.away)}</span></div>
      ${aw.length ? aw.map((x) => `<div class="grp"><h3>من ${esc(x.u.name)}</h3>${x.away.map((v) => `<div class="row"><span class="code"><bdi dir="ltr">${esc(v.code || '—')}</bdi></span><span class="grow">${esc(v.name || 'آلية')}<small>${esc(v.statusNote ? 'إلى: ' + enj(v.statusNote) : 'الجهة غير محددة')}${v.statusAction ? ' — ' + esc(v.statusAction) : ''}</small></span><span class="pill p-away"><i></i>مدعومة</span></div>`).join('')}</div>`).join('') : '<div class="none">لا توجد آليات مدعومة لجهات أخرى الآن.</div>'}</section>`;

    $('main').innerHTML = kpis + alertsHtml + cards + `<div class="two">${nrHtml}${awHtml}</div>` + table + `<p class="foot">البيانات من آخر نسخة منشورة لكل جهة، وتتحدث تلقائيًا كل ٥ دقائق. الحالة حسب جاهزية الآليات: «حرج» = أقل من ٥٠٪، «يحتاج متابعة» = أقل من ٨٠٪.</p>`;
  }

  /* ---------- نصوص للنسخ ---------- */
  function sumText() {
    const t = totals(), k = dutyShift();
    const L = [`ملخص جاهزية الجهات — ${hijri()}`, `الوردية المناوبة: ${SHN[k]}`, `الجاهزية الإجمالية للآليات: ${t.pct == null ? '—' : pctFmt(t.pct)} (${arD(t.c.ready)} من ${arD(t.rated)})`, `القوة المناوبة: ${arD(t.pres)} من ${arD(t.size)}`, ''];
    R.filter((x) => !x.empty).forEach((x) => L.push(`• ${x.u.name}: ${pct0(x)} — جاهزة ${arD(x.c.ready)} من ${arD(x.rated)}، متعطلة ${arD(x.c.down)}، صيانة ${arD(x.c.maint)}${x.c.away ? '، مدعومة ' + arD(x.c.away) : ''} ${x.size ? ' — الوردية ' + shiftTxt(x) : ''}`));
    const e = R.filter((x) => x.empty).map((x) => x.u.name);
    if (e.length) L.push('', 'لم تُدخل بياناتها بعد: ' + e.join('، '));
    return L.join('\n');
  }
  function downText() {
    const L = [`الآليات غير الجاهزة — ${hijri()}`];

  /* ---------- إحصائية المراكز والأقسام (ربع سنوية): تجمع ما يضيفه كل مركز وقسم من صفحة الرغاوي ---------- */
  const QN = { 1: 'الربع الأول', 2: 'الربع الثاني', 3: 'الربع الثالث', 4: 'الربع الرابع' };
  const QR = (q) => `${arD((q - 1) * 3 + 1)}/${arD(1)} – ${arD(q * 3)}/${arD(30)}`;
  const QK = { foam: 'الرغاوي', fuel: 'المحروقات', powder: 'طفايات البودرة' };
  const hNow = () => { const k = HFN ? hkey(HFN.format(new Date())) : 0; return { y: Math.floor(k / 10000) || 1448, m: Math.floor((k % 10000) / 100) || 1 }; };
  const toLat = (v) => String(v == null ? '' : v).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const numQ = (v) => { const x = parseFloat(toLat(v).replace(/[٫,]/g, '.')); return isNaN(x) ? 0 : x; };
  const nfQ = (n) => new Intl.NumberFormat('ar-SA', { maximumFractionDigits: 2 }).format(n);
  const qYear = (r) => +toLat(r.year) || hNow().y;
  const qFile = (r) => (r.file ? `blobs/${encodeURIComponent(r.file)}.${(String(r.fileName || '').split('.').pop() || 'pdf').toLowerCase().replace(/[^a-z0-9]/g, '') || 'pdf'}` : '');
  function qView() {
    const now = hNow(), curQ = Math.min(4, Math.ceil(now.m / 3));
    const all = []; R.forEach((x) => (x.qst || []).forEach((r) => all.push({ u: x.u, r })));
    // إحصائية محسوبة تلقائياً من حركات الوارد والصرف للجهة (لأي ربع لم تُضف له الجهة إحصائية يدوية لنفس النوع)
    const DEF = { foam: ['رغوة', 'جركل'], fuel: ['ديزل', 'لتر'], powder: ['طفاية بودرة (سطل)', 'سطل'] };
    const ymOf = (r) => { const k = hkey(r.date); return k ? { y: Math.floor(k / 10000), m: Math.floor((k % 10000) / 100) } : null; };
    const manual = new Set(all.map((o) => `${o.u.id}|${o.r.kind || 'foam'}|${qYear(o.r)}|${+o.r.q}`));
    R.forEach((x) => {
      const groups = {};
      (x.mov || []).forEach((r) => { const ym = ymOf(r); if (!ym) return; const kd = r.kind || 'foam', d = DEF[kd] || DEF.foam, item = r.item || d[0], unit = r.unit || d[1], key = `${kd}|${ym.y}|${item}|${unit}`; (groups[key] = groups[key] || { kd, y: ym.y, item, unit, rows: [] }).rows.push({ ...r, q: Math.min(4, Math.ceil(ym.m / 3)) }); });
      Object.values(groups).forEach((g) => {
        for (let q = 1; q <= 4; q++) {
          if (manual.has(`${x.u.id}|${g.kd}|${g.y}|${q}`)) continue;
          const inQ = g.rows.filter((r) => r.q === q); if (!inQ.length) continue;
          const sum = (L, dir) => L.filter((r) => r.dir === dir).reduce((a, r) => a + numQ(r.qty), 0);
          const cumIn = sum(g.rows.filter((r) => r.q <= q), 'in'), cumOut = sum(g.rows.filter((r) => r.q <= q), 'out');
          all.push({ u: x.u, r: { qstat: true, calc: true, kind: g.kd, q, year: String(g.y), item: g.item, unit: g.unit, qin: sum(inQ, 'in') || '', qout: sum(inQ, 'out') || '', qbal: cumIn > 0 ? cumIn - cumOut : '', note: 'محسوبة تلقائياً من حركات الوارد والصرف' } });
        }
      });
    });
    const years = [...new Set([now.y, ...all.map((o) => qYear(o.r))])].sort((a, b) => b - a);
    const y = S.qy && years.includes(S.qy) ? S.qy : now.y; S.qy = y;
    const inY = all.filter((o) => qYear(o.r) === y);
    const head = (t, back) => `<div class="panel" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px"><h2 style="margin:0;font-size:18px">${t}</h2><span style="flex:1"></span><button type="button" class="btn" data-act="${back}">→ الرجوع ${back === 'qList' ? 'للأرباع' : 'للوحة'}</button></div>`;
    const yearChips = years.length > 1 ? `<div class="chips" role="group" aria-label="العام">${years.map((v) => `<button type="button" class="chip" data-act="qYear" data-v="${v}" aria-pressed="${v === y}">${arD(v)}هـ</button>`).join('')}</div>` : '';
    if (!S.qq) {
      const cards = [1, 2, 3, 4].map((q) => {
        const rows = inY.filter((o) => +o.r.q === q), units = new Set(rows.map((o) => o.u.id)).size;
        return `<button type="button" class="panel qcard" data-act="qOpen" data-v="${q}" style="text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:6px;font:inherit;color:inherit"><b style="font-size:16px">إحصائية المراكز والأقسام — ${QN[q]}</b><span class="muted">${QR(q)} ${arD(y)}هـ${q === curQ && y === now.y ? ' · <b>الربع الحالي</b>' : ''}</span><span class="cnt">${rows.length ? `وردت ${arD(rows.length)} إحصائية من ${arD(units)} جهة` : 'لم ترد إحصائيات بعد'}</span></button>`;
      }).join('');
      $('main').innerHTML = `${head('إحصائية المراكز والأقسام', 'qBack')}${yearChips}<p class="muted" style="margin:6px 0 14px">إحصائيات الرغاوي والمحروقات وطفايات البودرة لكل مركز وقسم: ما يضيفه المركز من «إضافة إحصائية (ربع سنوي)»، وإن لم يضف فتُحسب من حركات الوارد والصرف المسجلة عنده. اختر الربع لعرض ما ورد.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px">${cards}</div>`;
      return;
    }
    const q = S.qq, k = S.qk || 'foam', rows = inY.filter((o) => +o.r.q === q);
    const order = (u) => (cfg.units || []).findIndex((v) => v.id === u.id);
    const mine = rows.filter((o) => (o.r.kind || 'foam') === k).sort((a, b) => order(a.u) - order(b.u));
    const got = new Set(mine.map((o) => o.u.id)), missing = (cfg.units || []).filter((u) => !got.has(u.id));
    const tabs = `<div class="chips" role="tablist" aria-label="النوع">${Object.entries(QK).map(([id, t]) => `<button type="button" class="chip" role="tab" data-act="qKind" data-v="${id}" aria-pressed="${id === k}">${t} <b>${arD(rows.filter((o) => (o.r.kind || 'foam') === id).length)}</b></button>`).join('')}</div>`;
    const sums = {}; mine.forEach((o) => { const u = o.r.unit || ''; (sums[u] = sums[u] || { i: 0, o: 0, b: 0, nb: 0 }); sums[u].i += numQ(o.r.qin); sums[u].o += numQ(o.r.qout); if (o.r.qbal !== undefined && o.r.qbal !== '') { sums[u].b += numQ(o.r.qbal); sums[u].nb++; } });
    const cell = (v, u) => (v !== undefined && v !== '' ? `<b>${esc(nfQ(numQ(v)))}</b> ${esc(u || '')}` : '—');
    const tbl = mine.length ? `<div class="panel" style="overflow-x:auto"><table><thead><tr><th>الجهة</th><th>الصنف</th><th>الوارد</th><th>المصروف</th><th>الرصيد</th><th>ملاحظة</th><th>المرفق</th></tr></thead><tbody>${mine.map((o) => `<tr><td class="n">${esc(o.u.name)}</td><td>${esc(o.r.item || '—')}</td><td>${cell(o.r.qin, o.r.unit)}</td><td>${cell(o.r.qout, o.r.unit)}</td><td>${cell(o.r.qbal, o.r.unit)}</td><td>${o.r.calc ? '<span class="muted">' + esc(o.r.note) + '</span>' : esc(o.r.note || '—')}</td><td>${qFile(o.r) ? `<a href="${esc(qFile(o.r))}" target="_blank" rel="noopener">عرض</a>` : '—'}</td></tr>`).join('')}</tbody><tfoot>${Object.entries(sums).map(([u, v]) => `<tr><th>الإجمالي ${u ? '(' + esc(u) + ')' : ''}</th><th></th><th>${nfQ(v.i)}</th><th>${nfQ(v.o)}</th><th>${v.nb ? nfQ(v.b) : '—'}</th><th></th><th></th></tr>`).join('')}</tfoot></table></div>` : `<div class="panel empty"><b>لم ترد إحصائيات ${QK[k]} لـ${QN[q]} بعد.</b></div>`;
    const miss = missing.length && mine.length ? `<p class="muted" style="margin-top:10px">لم ترد من: ${missing.map((u) => esc(u.name)).join('، ')}</p>` : '';
    $('main').innerHTML = `${head(`إحصائية المراكز والأقسام — ${QN[q]} ${arD(y)}هـ`, 'qList')}<p class="muted" style="margin:-4px 0 10px">${QR(q)}</p>${tabs}${tbl}${miss}`;
  }

  /* ---------- التعاميم: يضيفها مدير الإدارة فتصل لجميع المراكز والأقسام (data/shared/db/circulars.json) ---------- */
  const CODE = 'isnad-mgr-code', USR = 'isnad-mgr-usr', REF = 'isnad-mgr-ref', CPATH = 'data/shared/db/circulars.json';
  const PROXY = (cfg.editProxy || '').replace(/\/+$/, '');
  let circ = null, circSha = null, circErr = '';
  const b64u = (str) => { const by = new TextEncoder().encode(str); let s = ''; for (let i = 0; i < by.length; i += 0x8000) s += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000)); return btoa(s); };
  const ub64 = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, '')), (c) => c.charCodeAt(0)));
  function ghWho() { const t = ls.get('isnad-gh-token'), c = ss.get(CODE); if (c && PROXY) return { proxy: true, c }; if (t) return { t }; return null; }
  async function gh(path, opts = {}) {
    const w = ghWho(); if (!w) throw new Error('nokey');
    const url = w.proxy ? PROXY + '/gh' + path : 'https://api.github.com/repos/' + cfg.repo + path;
    const headers = w.proxy ? { 'X-Unit': 'manager', 'X-Code': w.c, 'X-User': ss.get(USR) || '', 'X-Ref': ss.get(REF) || '' } : { Authorization: 'Bearer ' + w.t, Accept: 'application/vnd.github+json' };
    const r = await fetch(url, Object.assign({ cache: 'no-store' }, opts, { headers: Object.assign(headers, opts.body ? { 'Content-Type': 'application/json' } : {}) }));
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(String(r.status));
    return r.json();
  }
  const ref = () => (cfg.branch ? '?ref=' + encodeURIComponent(cfg.branch) : '');
  async function loadCirc() {
    circErr = '';
    try {
      if (ghWho()) { const f = await gh('/contents/' + CPATH + ref()); circSha = f ? f.sha : null; circ = f ? JSON.parse(ub64(f.content)) : {}; return; }
    } catch (e) { circErr = 'تعذّر قراءة أحدث التعاميم من المستودع (' + e.message + ')، والمعروض آخر نسخة منشورة.'; }
    try { const r = await fetch('db.json', { cache: 'no-store' }); const d = r.ok ? await r.json() : {}; circ = (d.collections || {}).circulars || {}; } catch (e) { circ = {}; }
  }
  const rawUrl = (x) => (x.file ? `https://raw.githubusercontent.com/${cfg.repo}/${cfg.branch}/data/blobs/${x.file}.${x.ext}` : '');
  const EXTS = { 'application/pdf': 'pdf', 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document': 'docx' };
  async function saveCirc(mut, msg) {
    const f = await gh('/contents/' + CPATH + ref()); const cur = f ? JSON.parse(ub64(f.content)) : {};
    const next = mut(cur);
    await gh('/contents/' + CPATH, { method: 'PUT', body: JSON.stringify({ message: msg, content: b64u(JSON.stringify(next, null, 1) + '\n'), sha: f ? f.sha : undefined, branch: cfg.branch || undefined }) });
    circ = next;
  }
  function circView() {
    const can = !!ghWho();
    const list = Object.entries(circ || {}).map(([id, x]) => Object.assign({ id }, x)).sort((a, b) => (b.at || 0) - (a.at || 0));
    const form = can ? `<section class="panel"><div class="sh"><h2>إضافة تعميم جديد</h2></div>
      <form class="cform" id="cform">
        <label class="full">عنوان التعميم<input name="title" required placeholder="مثال: تعميم بشأن الالتزام بأوقات الدوام"></label>
        <label>رقم التعميم (اختياري)<input name="num" placeholder="مثال: ١٢٣٤/ص"></label>
        <label>التاريخ<input name="date" value="${esc(hijri())}"></label>
        <label class="full">نص مختصر أو ملاحظات (اختياري)<textarea name="note"></textarea></label>
        <label class="full">المرفق (PDF أو صورة أو Word)<input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,.docx,application/pdf,image/*"></label>
        <div class="full" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button type="submit" class="btn primary" id="cgo">إرسال التعميم لجميع المراكز والأقسام</button><span class="cerr" id="cerr"></span></div>
      </form></section>` : `<section class="panel"><div class="none">لإضافة التعاميم سجّل الدخول برمز لوحة المدير من جديد (الخروج ثم الدخول).</div></section>`;
    const rows = list.length ? `<div class="clist">${list.map((x) => `<div class="crow"><div class="ct"><b>${esc(x.title || 'تعميم')}</b><small>${[x.num ? 'رقم ' + x.num : '', x.date || ''].filter(Boolean).map(esc).join(' · ')}</small>${x.note ? `<p>${esc(x.note)}</p>` : ''}</div>
      ${x.file ? `<a class="btn" href="${esc(rawUrl(x))}" target="_blank" rel="noopener">عرض المرفق</a>` : ''}</div>`).join('')}</div>` : '<div class="none">لا توجد تعاميم بعد.</div>';
    $('main').innerHTML = `<div class="sh"><h2>التعاميم</h2><span class="grow"></span><button type="button" class="btn" data-act="circBack">→ الرجوع للوحة</button></div>${circErr ? `<p class="cerr">${esc(circErr)}</p>` : ''}${form}<section class="panel" style="margin-top:16px"><div class="sh"><h2>التعاميم المرسلة</h2><span class="cnt">${arD(list.length)}</span></div>${rows}</section>
      <p class="foot">يصل التعميم إلى صفحة «التعاميم» في جميع المراكز والأقسام، ويظهر لمدرائها تنبيه بوصول تعميم جديد (بعد دقيقة أو دقيقتين من الإرسال).</p>`;
    const fm = $('cform'); if (!fm) return;
    fm.addEventListener('submit', async (e) => {
      e.preventDefault(); const go = $('cgo'), er = $('cerr'); er.textContent = '';
      const fd = new FormData(fm), file = fd.get('file');
      go.disabled = true; go.textContent = 'جارٍ الإرسال…';
      try {
        let att = {};
        if (file && file.size) {
          const ext = EXTS[file.type] || (/\.docx$/i.test(file.name) ? 'docx' : ''); if (!ext) throw new Error('نوع الملف غير مدعوم');
          if (file.size > 20 * 1024 * 1024) throw new Error('الملف أكبر من 20 ميجابايت');
          const id = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, '0')).join('');
          const by = new Uint8Array(await file.arrayBuffer()); let bs = ''; for (let i = 0; i < by.length; i += 0x8000) bs += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000));
          await gh('/contents/data/blobs/' + id + '.' + ext, { method: 'PUT', body: JSON.stringify({ message: 'تعميم: رفع مرفق ' + file.name, content: btoa(bs), branch: cfg.branch || undefined }) });
          att = { file: id, ext, fileName: file.name };
        }
        const cid = 'c' + Date.now().toString(36);
        const rec = Object.assign({ title: String(fd.get('title') || '').trim(), num: String(fd.get('num') || '').trim(), date: String(fd.get('date') || '').trim(), note: String(fd.get('note') || '').trim(), at: Date.now() }, att);
        await saveCirc((cur) => Object.assign({}, cur, { [cid]: rec }), 'تعميم جديد: ' + rec.title.slice(0, 80));
        toast('أُرسل التعميم لجميع المراكز والأقسام'); circView();
      } catch (x) { er.textContent = 'تعذّر الإرسال: ' + (x.message === '403' ? 'رمز لوحة المدير لا يملك صلاحية الإرسال بعد (يلزم تحديث «الحارس»).' : x.message); go.disabled = false; go.textContent = 'إرسال التعميم لجميع المراكز والأقسام'; }
    });
  }
  async function openCirc() { S.circ = true; $('main').innerHTML = '<div class="panel loading">جارٍ تحميل التعاميم…</div>'; await loadCirc(); circView(); }

  /* ---------- الدخول ---------- */
  if (cfg.editProxy) { $('usrf').hidden = false; $('reff').hidden = false; }
  function showGate() { $('app').hidden = true; $('gate').hidden = false; setTimeout(() => $('pw').focus(), 50); }
  function showApp() { $('gate').hidden = true; $('app').hidden = false; load(); }
  async function check(pw, usr, rf) {
    // عند وجود «الحارس»: كلمة دخول اللوحة هي رمز manager فيه (لا تُكتب في الموقع العام)
    if (cfg.editProxy) {
      const r = await fetch(cfg.editProxy.replace(/\/+$/, '') + '/check', { method: 'POST', cache: 'no-store', headers: { 'X-Unit': 'manager', 'X-Code': pw, 'X-User': usr || '', 'X-Ref': rf || '' } });
      return r.ok;
    }
    if (cfg.mode === 'server') {
      const r = await fetch('api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw, unit: 'manager' }) });
      return r.ok;
    }
    const bytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('isnad:' + pw));
    return [...new Uint8Array(bytes)].map((b) => b.toString(16).padStart(2, '0')).join('') === cfg.hash;
  }
  $('gform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = $('pw').value, err = $('perr'), usr = $('usr').value.trim(), rf = $('ref').value.trim();
    err.hidden = true;
    if (cfg.editProxy && !usr) { err.textContent = 'الرجاء إدخال اسم المستخدم'; err.hidden = false; $('usr').focus(); return; }
    if (cfg.editProxy && !rf) { err.textContent = 'الرجاء إدخال رمز المرجع'; err.hidden = false; $('ref').focus(); return; }
    if (!pw) { err.textContent = 'الرجاء إدخال كلمة المرور'; err.hidden = false; return; }
    $('pgo').disabled = true;
    let ok = false;
    try { ok = await check(pw, usr, rf); } catch (x) {}
    $('pgo').disabled = false;
    if (!ok) { err.textContent = cfg.editProxy ? 'بيانات الدخول غير صحيحة' : 'كلمة المرور غير صحيحة'; err.hidden = false; $('pw').select(); return; }
    ss.set(AUTH, '1'); if (cfg.editProxy) { ss.set(CODE, pw); ss.set(USR, usr); ss.set(REF, rf); } $('pw').value = ''; $('ref').value = ''; showApp();
  });

  // المسؤول بمفتاح GitHub المحفوظ على جهازه (له صلاحية الكتابة على المستودع) يدخل اللوحة مباشرة
  async function adminKey() {
    const t = ls.get('isnad-gh-token'); if (!t || !cfg.repo) return false;
    try { const r = await fetch('https://api.github.com/repos/' + cfg.repo, { cache: 'no-store', headers: { Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json' } }); if (!r.ok) return false; const j = await r.json(); return !!(j.permissions && j.permissions.push); } catch (e) { return false; }
  }

  // زر «إظهار/إخفاء» داخل كل خانة كلمة مرور أو رمز، ليتأكد المستخدم مما يكتبه
  (function () {
    const EYE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
    const NOEYE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
    const add = (inp) => {
      if (inp.dataset.eye) return;
      inp.dataset.eye = '1';
      const w = document.createElement('span');
      w.style.cssText = 'position:relative;display:block;width:100%';
      inp.parentNode.insertBefore(w, inp);
      w.appendChild(inp);
      inp.style.paddingLeft = '44px';
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', 'إظهار ما كُتب');
      b.title = 'إظهار / إخفاء';
      b.innerHTML = EYE;
      b.style.cssText = 'position:absolute;top:50%;transform:translateY(-50%);left:6px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:transparent;color:var(--muted,#555);cursor:pointer;padding:0';
      b.addEventListener('mousedown', (e) => e.preventDefault());
      b.addEventListener('click', () => {
        const show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        b.innerHTML = show ? NOEYE : EYE;
        b.setAttribute('aria-label', show ? 'إخفاء ما كُتب' : 'إظهار ما كُتب');
        inp.focus();
      });
      w.appendChild(b);
    };
    const scan = () => document.querySelectorAll('input[type="password"]').forEach(add);
    scan();
    new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
  })();

  if (ss.get(AUTH) === '1') showApp(); else adminKey().then((ok) => { if (ok) { ss.set(AUTH, '1'); showApp(); } else showGate(); });
  setInterval(() => { if (!document.hidden && !$('app').hidden) load(); }, 5 * 60 * 1000);
})();
</script>
</body>
</html>
