<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول — قسم الإسناد</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<main class="login-page">
  <div class="login-brand">
    <div class="mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8B93A" stroke-width="2" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V5l-8-3Z"/></svg>
    </div>
    <div>قسم الإسناد</div>
  </div>

  <div class="login-card">
    <div class="login-logo"><img src="/assets/brand-logo.png" alt="شعار الدفاع المدني"></div>
    <h1 class="login-title" style="margin:0">قسم الإسناد</h1>
    <div class="login-sub">نظام أرشفة الآليات والمستودعات</div>

    <form class="login-form" id="loginForm" novalidate>
      <div class="login-field">
        <label for="password">كلمة المرور</label>
        <div class="input-icon">
          <input class="login-input" id="password" name="password" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" autofocus required>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        </div>
      </div>
      <div class="login-error" id="loginError" role="alert"></div>
      <button class="btn-gold login-btn" id="loginBtn" type="submit">دخول</button>
    </form>

    <div class="login-foot">الإدارة العامة للدفاع المدني — للاستخدام الداخلي فقط</div>
  </div>
</main>

<script>
  const form = document.getElementById('loginForm');
  const input = document.getElementById('password');
  const err = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('show');
    if (!input.value) {
      err.textContent = 'الرجاء إدخال كلمة المرور';
      err.classList.add('show');
      return;
    }
    btn.disabled = true;
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: input.value }),
      });
      if (r.ok) {
        location.href = '/';
        return;
      }
      err.textContent = 'كلمة المرور غير صحيحة';
    } catch {
      err.textContent = 'تعذّر الاتصال بالخادم';
    }
    err.classList.add('show');
    input.select();
    btn.disabled = false;
  });
</script>
</body>
</html>
