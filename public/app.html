<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قسم الإسناد — أرشيف الآليات والمستودعات</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <a class="side-brand" href="/vehicles" data-link>
      <div class="mark logo-mark"><img src="/assets/brand-logo.png" alt=""></div>
      <div>
        <div class="t1">قسم الإسناد</div>
        <div class="t2">الدفاع المدني</div>
      </div>
    </a>
    <nav class="side-nav" aria-label="القائمة الرئيسية">
      <a class="nav-item" href="/vehicles" data-link data-nav="vehicles">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><rect x="1" y="7" width="15" height="11" rx="1.5"/><path d="M16 10h3l3 3v5h-6z"/><circle cx="6" cy="19.5" r="1.8"/><circle cx="17.5" cy="19.5" r="1.8"/></svg>
        <span>الآليات</span>
      </a>
      <a class="nav-item" href="/warehouses" data-link data-nav="warehouses">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg>
        <span>المستودعات</span>
      </a>
      <a class="nav-item" href="/profiles" data-link data-nav="profiles">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>الملفات التعريفية</span>
      </a>
      <a class="nav-item" href="/returns" data-link data-nav="returns">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></svg>
        <span>تقارير الرجيع</span>
      </a>
      <a class="nav-item" href="/faults" data-link data-nav="faults">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M12 9v4"/><path d="M12 16.5v.5"/></svg>
        <span>أعطال المبنى</span>
      </a>
      <a class="nav-item" href="/staff" data-link data-nav="staff">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.1 4.4 1.8 5 4.9"/></svg>
        <span>الكادر البشري</span>
      </a>
      <a class="nav-item" href="/tx" data-link data-nav="tx">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>
        <span>المعاملات</span>
      </a>
      <a class="nav-item" href="/consum" data-link data-nav="consum">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16"/><path d="M3 21h13"/><path d="M7 7h5v4H7z"/><path d="M15 9h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V9l-3-3"/></svg>
        <span>الرغاوي والمحروقات</span>
      </a>
    </nav>
    <a class="side-logout" href="/logout" aria-label="تسجيل الخروج">
      <div class="av">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C3CEDE" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17-5-5 5-5"/><path d="M11 12h10"/></svg>
      </div>
      <span>تسجيل الخروج</span>
    </a>
  </aside>

  <main class="main" id="view" tabindex="-1"></main>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="عارض الصور">
  <img id="lbImg" alt="">
  <button class="lb-btn lb-close" id="lbClose" aria-label="إغلاق">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="الصورة السابقة">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <button class="lb-btn lb-next" id="lbNext" aria-label="الصورة التالية">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <div class="lb-count" id="lbCount"></div>
</div>

<script src="/assets/js/app.js"></script>
</body>
</html>
